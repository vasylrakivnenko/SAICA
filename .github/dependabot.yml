# Dependabot — version updates for this repository's own dependencies.
#
# Updates run weekly and open pull requests grouped by ecosystem. A new
# release is proposed only after it has been public for seven days
# (`cooldown`); that limit does not apply to security updates.
#
# Security updates and alerts are a repository setting (Settings → Code
# security), not part of this file. On 2026-11-21 both were off.
#
# References:
#   - data/tools/dependabot.yml (the catalog entry for this tool)

version: 2
updates:
  # Python — the requirement groups and the pin file (requirements/*.txt).
  - package-ecosystem: "pip"
    directory: "/requirements"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      python-prod:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["pytest", "pre-commit"]
      python-dev:
        applies-to: version-updates
        patterns: ["pytest", "pre-commit"]
    commit-message:
      prefix: "deps(py)"
      include: "scope"

  # JS / TS — Astro site build + types.
  - package-ecosystem: "npm"
    directory: "/site"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    groups:
      site-deps:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(site)"

  # GitHub Actions themselves — keep workflow versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
