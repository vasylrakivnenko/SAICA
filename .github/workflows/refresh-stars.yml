# Refresh of the GitHub star counts in data/tools/*.yml.
#
# Started by hand (Actions tab, "Run workflow"). The weekly schedule below
# is off. Before the first run the owner must allow workflows to open pull
# requests: Settings → Actions → General → "Allow GitHub Actions to create
# and approve pull requests".
#
# What it does:
#   1. `validator/fetch_github_stars.py` writes `stars` and
#      `stars_updated_at` for every tool whose repository is on github.com.
#   2. Files where the count did not change are put back, so the date moves
#      only where the number moved.
#   3. If any count changed, the files built from the tool files are
#      regenerated (manifest, maturity.json, RECOMMENDATIONS.md,
#      recommendations.json, SKILLS.md and the two SKILL.md copies) and the
#      catalog gate is run on the result.
#   4. One pull request with all of it is opened (or updated) on the branch
#      chore/refresh-stars. If nothing changed, no pull request is opened.
#
# Known limit: a pull request opened with the default token does not start
# the `tests`, `validate` and `site` workflows. Step 3 runs the catalog gate
# here for that reason. To get the other checks, close and reopen the pull
# request by hand.

name: refresh-stars

on:
  workflow_dispatch: {}
  # Uncomment to run every Monday at 07:00 UTC.
  # schedule:
  #   - cron: "0 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/kg.txt -c requirements/constraints.txt

      - name: Fetch star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python validator/fetch_github_stars.py

      # The script stamps today's date on every tool it could fetch. Keep a
      # file only when its `stars:` line changed; otherwise put it back.
      - name: Keep the date only where the count changed
        run: |
          for f in $(git diff --name-only -- data/tools); do
            if ! git diff -U0 -- "$f" | grep -qE '^[+-]stars:'; then
              git checkout -- "$f"
            fi
          done
          git diff --stat -- data/tools

      # Order matters: the last two print the manifest's date.
      - name: Regenerate the files built from the tool files
        run: |
          if git diff --quiet -- data/tools; then
            echo "No star count changed."
            exit 0
          fi
          python -m validator.generate_manifest
          python -m validator.generate_maturity
          python -m validator.generate_recommendations
          python -m validator.generate_skills

      - name: Run the catalog gate on the result
        run: |
          python validator/cli.py
          python -m validator.generate_schemas --check
          python -m validator.generate_manifest --check
          python -m validator.generate_maturity --check
          python -m validator.generate_recommendations --check
          python -m validator.generate_skills --check

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore: refresh GitHub stars"
          title: "chore: refresh GitHub stars"
          branch: chore/refresh-stars
          delete-branch: true
          add-paths: |
            data/tools/*.yml
            data/MANIFEST.json
            site/public/maturity.json
            RECOMMENDATIONS.md
            recommendations.json
            SKILLS.md
            skills/saica-supervise/SKILL.md
            plugin/skills/saica-supervise/SKILL.md
          body: |
            Automated refresh of `stars` and `stars_updated_at` in the tool
            files (`validator/fetch_github_stars.py`), with the generated
            files rebuilt from them in the same change. The catalog gate
            passed in the workflow run. The `tests`, `validate` and `site`
            checks do not start on this pull request by themselves: close
            and reopen it to run them.
          labels: |
            automation
            data-refresh
