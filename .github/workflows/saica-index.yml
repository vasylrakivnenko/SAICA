# SAICA Index — weekly leaderboard regeneration.
#
# Runs every Sunday at 04:17 UTC: audits every repo in both boards
# (kg_tools auto-derived from data/tools/, popular_oss curated in
# data/saica_index/seed_repos.yml), scores each with the formula in
# pipeline/saica_index/score.py, and writes site/public/saica_index.json.
#
# When the JSON changes, the workflow opens a commit on main with the
# new snapshot. The static site picks it up on next deploy.
#
# Manual trigger: `gh workflow run saica-index.yml`. Honors `--limit`
# via the `limit` input for testing without burning ~17min on the full
# population.

name: saica-index

on:
  schedule:
    # Sunday 04:17 UTC — off-peak, doesn't collide with promptfoo (Mon 06:37).
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Audit only the first N seeds per board (blank = all)"
        required: false
        default: ""

permissions:
  contents: write  # we commit the regenerated JSON back to main

concurrency:
  group: saica-index
  cancel-in-progress: false

jobs:
  regenerate:
    name: regenerate leaderboard JSON
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # `secrets.GITHUB_TOKEN` would lack permission to push the
          # commit; use `persist-credentials: true` so the default
          # token (with `contents: write`) is used by the push step.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r validator/requirements.txt
          pip install -r pipeline/requirements.txt

      - name: Run SAICA Index
        env:
          # Audit analyzer falls back to GitHub REST API when `git` isn't
          # on PATH; either way, `GITHUB_TOKEN` raises rate limit from
          # 60/hr → 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="--limit ${{ github.event.inputs.limit }}"
          fi
          python -m pipeline.saica_index.runner $ARGS

      - name: Commit regenerated snapshot if changed
        run: |
          git config user.name  "saica-index-bot"
          git config user.email "saica-index-bot@users.noreply.github.com"
          if git diff --quiet -- site/public/saica_index.json; then
            echo "No changes to saica_index.json — skipping commit."
            exit 0
          fi
          git add site/public/saica_index.json
          git commit -m "chore(saica-index): weekly leaderboard refresh

          Auto-generated by .github/workflows/saica-index.yml.
          See pipeline/saica_index/score.py for the scoring formula."
          git push origin HEAD:main
