# The catalog gate, on every pull request and every push to main. It fails when:
#   * a file under data/ breaks the schema or a cross-file rule
#   * a committed JSON Schema differs from the Pydantic models
#   * data/MANIFEST.json is behind data/ (an id was added, renamed or
#     removed; a removed id also needs an entry in data/TOMBSTONES.yml)
#   * a generated file differs from what its generator writes: SKILLS.md and
#     the two SKILL.md copies, RECOMMENDATIONS.md, recommendations.json,
#     site/public/maturity.json
#
# None of the checks reads the clock or the network, so the same commit gives
# the same answer on any day.
#
# When a check is red, regenerate in this order (the last two print the
# manifest's date, so the manifest goes before them):
#   python -m validator.generate_schemas
#   python -m validator.generate_manifest
#   python -m validator.generate_maturity
#   python -m validator.generate_recommendations
#   python -m validator.generate_skills
#
# Kept separate from tests.yml so a stale generated file and a failed unit
# test show up as two different checks.

name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      # The gate needs four small packages (pyyaml, pydantic, ruamel.yaml,
      # requests). It does not need the pipeline's machine-learning stack.
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements/kg.txt -c requirements/constraints.txt

      - name: Validate YAML nodes
        run: python validator/cli.py

      # Paper titles and first authors against the tracked copy of the arXiv
      # records (validator/cache/arxiv_records.json). No network.
      - name: Check paper records against the cached arXiv records
        run: python validator/cli.py --arxiv --offline

      - name: Check generated schemas are up to date
        run: python -m validator.generate_schemas --check

      - name: Check manifest is up to date
        run: python -m validator.generate_manifest --check

      - name: Check maturity.json is up to date
        run: python -m validator.generate_maturity --check

      - name: Check RECOMMENDATIONS artifacts are up to date
        run: python -m validator.generate_recommendations --check

      - name: Check SKILLS.md and the SKILL.md copies are up to date
        run: python -m validator.generate_skills --check
