# Live probes of the Ask endpoint, run with promptfoo. Started by hand only.
#
# promptfooconfig.yaml holds two cases (evals/ask_probe.yaml). Each one sends
# a real question to the Ask endpoint named in the repository variable
# ASK_API, so each run costs model calls. The job is skipped when ASK_API is
# not set: without it both cases fail with "NOT RUN", and they never report
# a pass for a probe that did not run.
#
# The checks of recommendations.json that used to run here are ordinary
# tests now (tests/test_recommendations_file.py, part of the `tests`
# workflow).
#
# References:
#   - promptfooconfig.yaml, evals/ask_probe.yaml, evals/_assertions.py
#   - data/tools/promptfoo.yml — catalog entry

name: promptfoo

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eval:
    name: live Ask probes
    if: ${{ vars.ASK_API != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The cases are graded by Python helpers (standard library only).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # promptfoo is fetched at run time, at the version the benchmark's
      # promptfoo rows were run with (bench/*/run_promptfoo.py). There is no
      # package.json at the repository root on purpose: Node stays in site/.
      - name: Run the probes
        run: |
          npx --yes promptfoo@0.125.1 eval \
            --no-cache \
            --max-concurrency 2 \
            --output results.json
        env:
          ASK_API: ${{ vars.ASK_API }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: promptfoo-results
          path: results.json
          if-no-files-found: warn
          retention-days: 30
