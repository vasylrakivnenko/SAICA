# Semgrep static analysis of this repository: on every pull request, on every
# push to main, and once a week.
#
# This is the form Semgrep documents today: its container image plus the
# `semgrep` command. (The `semgrep/semgrep-action` action used here before is
# archived.) No Semgrep account or token is needed. The four rule packs are
# downloaded from semgrep.dev when the job runs; `--metrics=off` sends no usage
# data. Any finding fails the job (`--error`).
#
# The image is pinned by version and digest. To move to a newer one, change
# both; the digest of a tag is shown on hub.docker.com/r/semgrep/semgrep/tags.
#
# References:
#   - data/tools/semgrep.yml — catalog entry
#   - data/failure_modes/security_vulnerability.yml

name: Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly run: new rules can find something in code that did not change.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/default
          --config p/security-audit
          --config p/secrets
          --config p/owasp-top-ten
          --error
          --metrics=off
