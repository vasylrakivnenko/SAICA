# Full pytest suite on every PR and push to main.
#
# Kept separate from validate.yml so a failed unit test doesn't obscure a
# schema/manifest drift failure (and vice-versa) in the PR checks list.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r validator/requirements.txt
          pip install -r pipeline/requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest tests/ pipeline/ -q
