# The Python test suite, on every pull request and every push to main.
#
# Kept separate from validate.yml so a failed unit test and a stale generated
# file show up as two different checks.
#
# Which tests run is decided in one place: `testpaths` in pytest.ini
# (tests/, pipeline/ and the benchmark's own test folders).

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      # requirements/dev.txt holds what the suite imports and nothing else
      # (no torch: no test loads the embedding model). Versions come from
      # requirements/constraints.txt.
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements/dev.txt -c requirements/constraints.txt

      - name: Run pytest
        run: python -m pytest -q
