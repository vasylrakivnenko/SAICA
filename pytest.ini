[pytest]
# Bare `pytest` from the repo root must only collect the project's own
# suites (same scope as CI and the pre-push hook, which both run plain
# `python -m pytest -q`). Without this, discovery walks into bench/ —
# vendored third-party repos, per-bench virtualenvs and SWE-style fixture
# files — and aborts with hundreds of collection errors.
#
# So the benchmark's test folders are listed one by one. Never add `bench`
# itself. A new bench test folder must be added here to run in CI.
# Explicit paths (e.g. `pytest bench/<x>/tests`) are unaffected.
testpaths =
    tests
    pipeline
    bench/tests
    bench/security/tests
    bench/scope_creep/tests
    bench/labelcheck/tests
