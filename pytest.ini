[pytest]
# Bare `pytest` from the repo root must only collect the project's own
# suites (same scope as CI and the pre-push hook). Without this, discovery
# walks into bench/ — vendored third-party repos, per-bench virtualenvs and
# SWE-style fixture files — and aborts with hundreds of collection errors.
# Explicit paths (e.g. `pytest bench/<x>/tests`) are unaffected.
testpaths = tests pipeline
