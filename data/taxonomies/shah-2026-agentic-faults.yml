id: shah-2026-agentic-faults
name: "Characterizing Faults in Agentic AI: A Taxonomy of Types, Symptoms, and Root Causes"
owner: "Shah, Morovati, Rahman, Khomh (Dalhousie University; Polytechnique Montréal)"
version: "arXiv v2 (2026-05-07)"
first_published: 2026-03-06
last_updated: 2026-05-07
url: https://arxiv.org/abs/2603.06847
license: "arXiv preprint, CC BY 4.0"
paper_id: shah-2026-characterizing-faults
verified_against_source: 2026-11-21
scope: >
  Taxonomy of faults in agentic AI software, built from 13,602 closed
  issues and merged pull requests in 40 open-source repositories; 385
  faults were sampled and coded by hand, and 145 practitioners rated the
  result. Version 2 of the paper has three lists: 34 fault types in 14
  categories and four dimensions (Figure 2), 12 symptom categories
  (Table 1) and 12 root-cause categories (Table 2). The unit of study is a
  defect in the code of an agent framework, library, tool or application.
  It is not a failure of a coding agent on a user's task.

categories:
  # --- Four dimensions (Figure 2) ---
  - external_id: SHAH-DIM-01
    label: "I. Agent Reasoning & Control"
    description: >
      86 faults. Faults in the agent's own reasoning and control flow: the
      LLM-driven logic that decides, iterates and updates state across steps.
  - external_id: SHAH-DIM-02
    label: "II. Context & Memory"
    description: >
      67 faults. Faults in how agents take in information, keep context
      artefacts and interpret mixed inputs (model text next to code, files or
      database records).
  - external_id: SHAH-DIM-03
    label: "III. Tooling, Integration & Actuation"
    description: >
      62 faults. Faults that arise when agents call tools, APIs and external
      systems, whose interfaces are strict while the agent's reasoning is not.
  - external_id: SHAH-DIM-04
    label: "IV. System Infrastructure & Reliability"
    description: >
      155 faults. System-level faults in the runtime environment, dependencies
      and operational tooling. The paper notes they are "not intrinsic to
      agent reasoning or decision-making".

  # --- 14 categories (parent = dimension) ---
  - external_id: SHAH-CAT-01
    label: "LLM Interaction"
    description: >
      48 faults. Faults at the interface between an agent framework and an LLM
      provider: wrong model or provider configuration, incompatible API usage,
      inconsistent token accounting, errors in context-window handling.
    parent_id: SHAH-DIM-01
  - external_id: SHAH-CAT-02
    label: "Agent Lifecycle and State"
    description: >
      38 faults. Faults in the execution lifecycle of an agent: incorrect
      scheduling, improper task delegation, inconsistent state transitions,
      defective termination logic. Agents may skip tasks, repeat actions, lose
      intermediate state or loop.
    parent_id: SHAH-DIM-01
  - external_id: SHAH-CAT-03
    label: "Memory Management"
    description: >
      8 faults. Faults in the code that stores or retrieves context artefacts:
      serialization, timestamp handling, persistent storage.
    parent_id: SHAH-DIM-02
  - external_id: SHAH-CAT-04
    label: "Input Interpretation"
    description: >
      59 faults. Inputs to the agent are parsed, validated, transformed or
      interpreted incorrectly: wrong assumptions about structure or type,
      flawed parsing, inconsistent encodings, missing validation.
    parent_id: SHAH-DIM-02
  - external_id: SHAH-CAT-05
    label: "Tool Invocation"
    description: >
      11 faults. The agent invokes a defective tool or invokes a tool
      incorrectly: API-contract violations, unsupported operations, mismatched
      parameters.
    parent_id: SHAH-DIM-03
  - external_id: SHAH-CAT-06
    label: "External Access"
    description: >
      19 faults. The agent cannot establish or keep access to an external
      service: invalid endpoints, misconfigured connections, poor handling of
      credentials or permissions.
    parent_id: SHAH-DIM-03
  - external_id: SHAH-CAT-07
    label: "Resource Interaction"
    description: >
      21 faults. Faults around shared resources needed for tool execution:
      invalid resource paths, wrong filesystem assumptions, misconfigured
      storage or databases.
    parent_id: SHAH-DIM-03
  - external_id: SHAH-CAT-08
    label: "System Coordination"
    description: >
      6 faults. Poor coordination of concurrent or asynchronous execution:
      race conditions and incoherent output.
    parent_id: SHAH-DIM-03
  - external_id: SHAH-CAT-09
    label: "Execution Monitoring"
    description: >
      5 faults. Logging, tracing or metrics are missing or wrong, so a failure
      cannot be reconstructed.
    parent_id: SHAH-DIM-03
  - external_id: SHAH-CAT-10
    label: "Dependency & Environment Management"
    description: >
      72 faults. Defects in specifying, resolving or installing software
      dependencies: incompatible versions, missing packages, inconsistent
      environments, specifications left outdated by upstream changes. The
      largest category.
    parent_id: SHAH-DIM-04
  - external_id: SHAH-CAT-11
    label: "Platform & Integration Compatibility"
    description: >
      15 faults. Assumptions about the platform do not hold at run time:
      operating system, CPU architecture, filesystem limits, system utilities.
    parent_id: SHAH-DIM-04
  - external_id: SHAH-CAT-12
    label: "Failure Handling & Implementation Robustness"
    description: >
      47 faults. Faults in detecting, propagating and handling failures:
      suppressed exceptions, wrongly propagated error signals, recovery that
      does not work. They show up as "silent execution failures, incomplete
      task execution, or systems continuing operation with erroneous internal
      states".
    parent_id: SHAH-DIM-04
  - external_id: SHAH-CAT-13
    label: "User Interface Defects"
    description: >
      13 faults. User-facing interfaces (dashboards, visualisations) show
      system state or execution context incorrectly.
    parent_id: SHAH-DIM-04
  - external_id: SHAH-CAT-14
    label: "Documentation Issues"
    description: >
      8 faults. Documentation describes behaviour, configuration or usage
      incorrectly.
    parent_id: SHAH-DIM-04

