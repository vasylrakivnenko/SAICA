  # --- 12 symptom categories (Table 1; a separate list, no parent) ---
  - external_id: SHAH-SYM-01
    label: "Data and Validation Errors"
    description: >
      80 occurrences (22.7%). Intermediate artefacts passed between components
      cannot be interpreted: parsing failures, schema validation exceptions,
      malformed values.
  - external_id: SHAH-SYM-02
    label: "Runtime Execution Errors"
    description: >
      68 occurrences (19.3%). Agent workflows stop unexpectedly or halt:
      interrupted workflows, failed steps, incomplete reasoning loops.
  - external_id: SHAH-SYM-03
    label: "Unhandled Exceptions"
    description: >
      45 occurrences (12.8%). Runtime errors propagate without being caught:
      abrupt termination with a stack trace.
  - external_id: SHAH-SYM-04
    label: "Build Errors"
    description: >
      32 occurrences (9.1%). Components cannot be compiled or packaged:
      compilation failures, unresolved imports, CI failures.
  - external_id: SHAH-SYM-05
    label: "Dependency Installation Errors"
    description: >
      28 occurrences (8.0%). Required libraries cannot be installed:
      unresolved dependency trees, incompatible versions, missing modules.
  - external_id: SHAH-SYM-06
    label: "Agent Behaviour Anomalies"
    description: >
      24 occurrences (6.8%). The agent's actions or outputs deviate from the
      planned workflow: repeated reasoning steps, role violations, loss of
      conversational context, coordination breakdowns, often without a crash.
  - external_id: SHAH-SYM-07
    label: "LLM Interaction Errors"
    description: >
      22 occurrences (6.2%). The agent gets no response from its model:
      rejected API calls, unsupported model invocations, authentication
      failures, context overflows.
  - external_id: SHAH-SYM-08
    label: "Network Connectivity Errors"
    description: >
      17 occurrences (4.8%). The agent cannot reach an external service:
      timeouts, unreachable endpoints, rejected requests.
  - external_id: SHAH-SYM-09
    label: "User Interface Errors"
    description: >
      15 occurrences (4.3%). Information about the agent's execution is shown
      incorrectly or incompletely.
  - external_id: SHAH-SYM-10
    label: "Tool Invocation Errors"
    description: >
      9 occurrences (2.6%). A call to an external function or service fails:
      runtime errors, interrupted steps, unavailable capabilities.
  - external_id: SHAH-SYM-11
    label: "File and Resource Access Errors"
    description: >
      9 occurrences (2.6%). The agent cannot read or write an artefact it
      needs: file not found, read failures, failed saves.
  - external_id: SHAH-SYM-12
    label: "Concurrency Errors"
    description: >
      3 occurrences (0.9%). Inconsistent output order, merged responses or
      non-deterministic behaviour when components run at the same time.

  # --- 12 root-cause categories (Table 2; a separate list, no parent) ---
  - external_id: SHAH-RC-01
    label: "Data Schema Mismatches"
    description: >
      101 occurrences (28.0%). Loosely structured producers (LLM outputs, tool
      return values) meet strictly typed consumers (parsers, validators) under
      inconsistent assumptions about data representation.
  - external_id: SHAH-RC-02
    label: "Dependency Drift"
    description: >
      79 occurrences (21.9%). External libraries, SDKs and runtimes change
      independently: they "introduce breaking changes, deprecate interfaces,
      or alter platform support", which invalidates assumptions built into the
      framework.
  - external_id: SHAH-RC-03
    label: "State Management Complexity"
    description: >
      51 occurrences (14.1%). Execution state (context windows, tool traces,
      memory structures) is read and written by several components that come
      to interpret or update it inconsistently.
  - external_id: SHAH-RC-04
    label: "Model Interface Instability"
    description: >
      42 occurrences (11.6%). Assumptions about a model provider's API
      parameters, response structures and supported behaviour are broken by
      API changes.
  - external_id: SHAH-RC-05
    label: "Error Propagation Failures"
    description: >
      29 occurrences (8.0%). Errors from LLM calls, tools or external services
      cross several layers without proper handling, so information about the
      original failure is lost.
  - external_id: SHAH-RC-06
    label: "Configuration Ambiguity"
    description: >
      15 occurrences (4.2%). Configuration is assembled from several sources
      (environment variables, files, constructor arguments, defaults) without
      a clearly defined or enforced schema.
  - external_id: SHAH-RC-07
    label: "External API Instability"
    description: >
      12 occurrences (3.3%). External APIs change their endpoints,
      authentication or request and response schemas, and the integration code
      is not updated in time.
  - external_id: SHAH-RC-08
    label: "Architectural Coupling"
    description: >
      10 occurrences (2.8%). Tight coupling between components and
      abstractions inside the framework: small internal changes break
      components that relied on earlier behaviour.
  - external_id: SHAH-RC-09
    label: "Resource Limit Violations"
    description: >
      7 occurrences (1.9%). Implicit assumptions about memory use, payload
      size, context length or API rate limits are exceeded.
  - external_id: SHAH-RC-10
    label: "Credential Misconfiguration"
    description: >
      5 occurrences (1.4%). Missing, invalid or insufficiently scoped
      credentials stay undetected until they are used.
  - external_id: SHAH-RC-11
    label: "Concurrency Issues"
    description: >
      5 occurrences (1.4%). Asynchronous or parallel execution over shared
      mutable state without proper synchronisation.
  - external_id: SHAH-RC-12
    label: "Documentation Drift"
    description: >
      5 occurrences (1.4%). Outdated documentation: documented usage and
      actual behaviour diverge.

notes: >
  Rebuilt on 2026-11-21 from the arXiv v2 PDF (2026-05-07): Figure 2 for
  the fault tree, Table 1 for symptoms, Table 2 and section 3.1.3 for root
  causes. All 76 labels and all counts were compared with the text of the
  PDF by script. The ids (SHAH-DIM, SHAH-CAT, SHAH-FT, SHAH-SYM, SHAH-RC)
  are SAICA-KG's; the paper publishes none. Counts are as printed: the
  fault tree adds up to 370, Table 1 to 352 and Table 2 to 361, while the
  sample is 385, and the percentages in the tables use the table totals.

  Version history. Version 1 of the paper (2026-03-06) had a different
  structure: five dimensions, 13 major categories, 37 fault categories, 13
  symptom classes and 12 root causes with other names. Until 2026-11-21
  this file followed v1 for the dimensions and the 13 major categories
  (ids SHAH-MAJ-01 to -13, now replaced by SHAH-CAT-01 to -14). Its 12
  root-cause labels (for example "Incorrect Token Management", "Datetime
  Conversion Errors", "Exception Suppression") matched Table 2 of neither
  version. The ids SHAH-DIM-01 to -04 and SHAH-RC-01 to -12 are kept but
  now name the v2 entries, so an old reference by id must be re-read. The
  same rebuild was first made on 2026-08-18 (commit 4977acf) and was lost
  in the reset of 2026-11-19.

inclusion_rationale: >
  The largest hand-coded study of faults in agentic AI software that the KG
  knows of (385 sampled faults, 40 repositories, 145 practitioners). It
  shows which SAICA failure modes have a neighbour among the defects
  developers report in agent software and which do not. It cannot show
  that the SAICA modes are complete or separate, because it studies
  software defects, not agent behaviour; see data/crosswalks/shah-to-saica.yml.
