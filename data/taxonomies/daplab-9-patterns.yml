id: daplab-9-patterns
name: "9 Critical Failure Patterns of Coding Agents"
owner: Columbia DAPLab (Reya Vir and collaborators)
version: "2026-01"
first_published: 2026-01-08
url: https://daplab.cs.columbia.edu/general/2026/01/08/9-critical-failure-patterns-of-coding-agents.html
license: "Blog post; attribution requested"
scope: >
  Empirical failure patterns observed across 15+ applications and 5
  state-of-the-art coding agents (Claude Code, Cline, Cursor, v0, Replit).

categories:
  - external_id: DAP-01
    label: Incomplete Task Execution
    description: Agent claims completion while key subtasks remain undone.
  - external_id: DAP-02
    label: Fabricated References
    description: Agent emits code referencing non-existent functions or packages.
  - external_id: DAP-03
    label: Stale API Usage
    description: Agent uses deprecated or removed APIs.
  - external_id: DAP-04
    label: Cascading Error Recovery
    description: Agent's fix attempts introduce new errors that compound.
  - external_id: DAP-05
    label: Context Window Overflow
    description: Important context is truncated; agent drifts.
  - external_id: DAP-06
    label: Tool Misinvocation
    description: Correct tool, wrong arguments or wrong sequence.
  - external_id: DAP-07
    label: Silent Test-Passing Workaround
    description: Agent modifies tests or test harness to mask failure.
  - external_id: DAP-08
    label: Destructive Action
    description: Agent executes rm/force-push/commit bypass without human approval.
  - external_id: DAP-09
    label: Goal Drift
    description: Agent's working goal diverges from the user's stated goal.

notes: >
  Category labels paraphrased for seed. Verify against the original DAPLab
  post before v0.1 release. Reya Vir is the top co-author candidate identified
  by the landscape agent.

inclusion_rationale: >
  Closest spiritual sibling to SAICA-KG — an empirical classification of
  coding-agent failures. Not a registry and not a KG, which is exactly the
  gap SAICA-KG fills. Crosswalks from DAPLab patterns to SAICA-KG FailureMode
  tags are a high-value day-1 artifact.
