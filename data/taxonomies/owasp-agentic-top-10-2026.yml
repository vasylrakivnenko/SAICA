id: owasp-agentic-top-10-2026
name: "OWASP Top 10 for Agentic Applications 2026"
owner: OWASP Gen AI Security Project
version: "2026"
first_published: 2025-12-09
url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
license: "CC BY-SA 4.0"
verified_against_source: 2026-11-21
scope: >
  Ten security risks of autonomous and agentic AI applications, ASI01 to
  ASI10, published by the OWASP Gen AI Security Project (the document is
  marked "Version 2026" and dated December 2025). A security list: each
  entry is a class of attack or weakness, with examples, attack scenarios
  and mitigations. It is not limited to coding agents.

categories:
  - external_id: ASI01
    label: Agent Goal Hijack
    description: >
      Attackers "manipulate an agent's objectives, task selection, or
      decision pathways", for example through prompt-based manipulation,
      deceptive tool outputs, malicious artefacts, forged agent-to-agent
      messages or poisoned external data. It works because agents "cannot
      reliably distinguish instructions from related content".
  - external_id: ASI02
    label: Tool Misuse and Exploitation
    description: >
      "Agents can misuse legitimate tools due to prompt injection,
      misalignment, or unsafe delegation or ambiguous instruction." The
      agent stays within its authorised privileges but uses a legitimate
      tool in an unsafe or unintended way, "for example deleting valuable
      data, over-invoking costly APIs, or exfiltrating information".
      Privilege escalation belongs to ASI03 and code execution to ASI05.
  - external_id: ASI03
    label: Identity and Privilege Abuse
    description: >
      Exploits "dynamic trust and delegation in agents to escalate access
      and bypass controls": delegation chains, role inheritance, control
      flows and agent context such as cached credentials or conversation
      history.
  - external_id: ASI04
    label: Agentic Supply Chain Vulnerabilities
    description: >
      Arise "when agents, tools, and related artefacts they work with are
      provided by third parties and may be malicious, compromised, or
      tampered with in transit": models and weights, tools, plug-ins,
      datasets, other agents, MCP and A2A interfaces, registries and
      update channels. Examples in the text include typo-squatted tools
      and endpoints, a compromised MCP or package registry and a
      compromised npm package installed by coding agents.
  - external_id: ASI05
    label: Unexpected Code Execution (RCE)
    description: >
      Agentic systems, "including popular vibe coding tools", generate and
      run code. "Attackers exploit code-generation features or embedded
      tool access to escalate actions into remote code execution (RCE),
      local misuse, or exploitation of internal systems." One listed
      example is "code hallucination generating malicious or exploitable
      constructs".
  - external_id: ASI06
    label: Memory & Context Poisoning
    description: >
      "Adversaries corrupt or seed this context with malicious or
      misleading data, causing future reasoning, planning, or tool use to
      become biased, unsafe, or aid exfiltration." Context here is what an
      agent retains, retrieves or reuses (summaries, embeddings, RAG
      stores), not a one-time prompt.
  - external_id: ASI07
    label: Insecure Inter-Agent Communication
    description: >
      Exchanges between agents "lack proper authentication, integrity, or
      semantic validation", which allows "interception, spoofing, or
      manipulation of agent messages and intents".
  - external_id: ASI08
    label: Cascading Failures
    description: >
      "A single fault (hallucination, malicious input, corrupted tool, or
      poisoned memory) propagates across autonomous agents, compounding
      into system-wide harm." The entry is about the spread and
      amplification of a fault across agents, tools and workflows, not
      about the first fault.
  - external_id: ASI09
    label: Human-Agent Trust Exploitation
    description: >
      Adversaries or misaligned designs exploit the trust people place in
      a fluent, expert-sounding agent "to influence user decisions, extract
      sensitive information, or steer outcomes for malicious purposes".
      The risk grows when people approve actions without checking them.
  - external_id: ASI10
    label: Rogue Agents
    description: >
      "Malicious or compromised AI Agents that deviate from their intended
      function or authorized scope, acting harmfully, deceptively, or
      parasitically within multi-agent or human-agent ecosystems." The
      entry is about the loss of behavioural integrity once the drift has
      begun, not about the first intrusion.

inclusion_rationale: >
  OWASP's list of security risks for agentic applications. Having it as a
  taxonomy node lets readers go from an OWASP entry to the SAICA failure
  modes it touches. Most entries describe attacks; SAICA
  modes mostly describe failures an agent makes without an attacker, so
  only part of the list has a counterpart.

notes: >
  Checked on 2026-11-21 against the PDF "OWASP Top 10 for Agentic
  Applications 2026" (57 pages, created 2025-12-09) downloaded from
  genai.owasp.org/download/52117. The ten ids and labels match the
  document. Descriptions were rewritten from each entry's "Description"
  section; quoted text is copied from it. Two earlier statements were
  wrong and are removed: ASI04 does not mention slopsquatting or
  hallucinated package names (it covers typo-squatted tools, endpoints
  and packages and compromised registries), and ASI02 is not about
  exceeding granted authority (that is ASI03). The licence field said
  "CC-BY"; the document states CC BY-SA 4.0.
