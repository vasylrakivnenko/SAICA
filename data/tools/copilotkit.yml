id: copilotkit
name: CopilotKit
tagline: The frontend stack for agents and generative UI — React and Angular.
description: >
  CopilotKit is a React/Angular framework for embedding AI agents into web
  UIs. Exposes typed actions, generative UI components, and HITL approval UI
  primitives. Positions the frontend as a first-class supervision layer where
  humans confirm or adjust agent-proposed actions.
