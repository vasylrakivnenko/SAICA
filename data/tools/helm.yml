id: helm
name: helm
tagline: Holistic Evaluation of Language Models (HELM).
description: >
  Stanford CRFM's HELM is a benchmark suite covering accuracy, calibration,
  robustness, fairness, bias, toxicity, and efficiency across a scenario ×
  metric matrix. Establishes the 'holistic evaluation' template that many
  later LLM evaluation efforts cite.
