stars: 3665
stars_updated_at: '2026-11-21'
inclusion_rationale: >
  Occupies detection × post_generation × graduated_hitl with the RAG Triad —
  context relevance, groundedness, and answer relevance — as programmable
  feedback functions over instrumented traces. Distinguished from general
  LLM-observability platforms (arize-phoenix) by centering RAG-specific
  groundedness metrics and from deepeval by exposing those metrics as live
  feedback functions rather than Pytest assertions. Useful as the canonical
  RAG-evaluation exemplar in the post-generation detection cell.
