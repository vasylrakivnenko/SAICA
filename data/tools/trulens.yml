id: trulens
name: TruLens
tagline: Evaluation and Tracking for LLM Experiments and AI Agents
description: TruLens provides open-source tools for evaluating and tracking LLM experiments with programmable feedback functions. It enables developers to instrument, evaluate, and iterate on LLM applications using feedback functions for quality assessment, including coverage of context relevance, groundedness, and answer relevance.
first_released: '2020-11-02'
last_updated: '2026-04-22'
maturity_status: experimental
repository_url: https://github.com/truera/trulens
license: MIT
control_paradigm: detection
temporal_phase: post_generation
autonomy_level: graduated_hitl
addresses_failure_modes:
  - fabrication
  - context_pollution
locus_of_control:
  - environment
stars: 3266
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies detection × post_generation × graduated_hitl with the RAG Triad —
  context relevance, groundedness, and answer relevance — as programmable
  feedback functions over instrumented traces. Distinguished from general
  LLM-observability platforms (langfuse, langsmith, arize-phoenix) by
  centering RAG-specific groundedness metrics and from deepeval by exposing
  those metrics as live feedback functions rather than Pytest assertions.
  Useful as the canonical RAG-evaluation exemplar in the post-generation
  detection cell.
