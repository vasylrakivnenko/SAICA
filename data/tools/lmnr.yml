id: lmnr
name: lmnr
tagline: Laminar — open-source observability platform purpose-built for AI agents.
description: >
  Laminar is an open-source observability platform purpose-built for agents.
  Captures long-running agent trajectories, browser sessions, and tool calls,
  and pairs trace capture with online evals and prompt/tool versioning. YC S24
  batch.
