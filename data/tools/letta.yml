id: letta
name: letta
tagline: Stateful agents framework with memory, reasoning, and context management (formerly MemGPT).
description: >
  Letta (formerly MemGPT) introduces 'MemGPT-style' long-term memory for LLM
  agents: tiered context buffers, summarization, and explicit memory tools
  that let agents write to and retrieve from long-term storage. Addresses
  runaway context pollution.
