id: cline
name: Cline
tagline: VS Code extension coding agent with per-action approval and auto-approve allow-lists.
description: >
  Open-source VS Code extension (formerly Claude Dev) that runs a coding
  agent inside the editor with an explicit plan/act mode toggle and a
  granular auto-approve panel covering read, edit, command, browser, and
  MCP actions. Supervision primitives: plan-mode reviews, per-tool
  auto-approve checkboxes, a max-requests cap per task, and checkpoint
  snapshots that allow rollback. Autonomy regime is user-configurable from
  full_hitl to fully_autonomous; canonical mode is graduated_hitl.

