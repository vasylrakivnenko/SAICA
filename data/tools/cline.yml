inclusion_rationale: >
  Occupies prevention × pre_generation × graduated_hitl as the open-source
  sibling to Claude Code. Distinctive primitive is the per-tool auto-approve
  matrix, which exposes the graduated-HITL dial explicitly rather than
  hiding it behind a single auto-mode toggle.
