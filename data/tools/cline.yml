security_notes: >
  Open-source, user-installed VS Code extension. The auto-approve panel is
  deliberately granular so users can narrow each tool category; enabling
  auto-approve-all is functionally equivalent to fully_autonomous and
  should only be used inside a sandbox. MCP-server support inherits
  upstream supply-chain risk — audit installed servers.
