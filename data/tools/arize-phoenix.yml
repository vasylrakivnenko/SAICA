inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous alongside
  Langfuse and LangSmith but with a tighter OpenTelemetry/
  OpenInference standardization posture and a notebook-friendly local
  mode. Worth modeling as a distinct node because it is the de-facto
  reference implementation of OpenInference semantic conventions for
  LLM traces.
