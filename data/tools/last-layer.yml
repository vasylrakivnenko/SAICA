id: last-layer
name: last_layer
tagline: Ultra-fast, low latency LLM prompt injection/jailbreak detection
description: A low-latency detection system for LLM prompt injection and jailbreak attempts. The tool analyzes incoming prompts to identify adversarial inputs designed to bypass safety filters, manipulate model behavior, or extract sensitive information through injection-based attacks.
first_released: '2024-03-29'
last_updated: '2024-07-26'
maturity_status: experimental
repository_url: https://github.com/arekusandr/last_layer
license: MIT
control_paradigm: detection
temporal_phase: pre_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - security_vulnerability
locus_of_control:
  - prompt
  - environment
stars: 126
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies detection × pre_generation × fully_autonomous against prompt
  injection and jailbreak inputs. Distinguished from rebuff by emphasizing
  ultra-low-latency inline classification (no heuristic-LLM ensemble, no
  canary-token DB round-trip), making it suitable for the fast-path filter
  slot in front of coding agents that cannot tolerate a second model call per
  request. Useful as the lightweight-detector exemplar on the pre-generation
  input surface.
