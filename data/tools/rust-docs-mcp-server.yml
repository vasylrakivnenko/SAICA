id: rust-docs-mcp-server
name: Govcraft/rust-docs-mcp-server
tagline: Prevents outdated Rust code suggestions by fetching current crate docs with embeddings/LLM context.
description: An MCP server that prevents outdated Rust code suggestions from AI assistants by fetching current crate documentation. It uses embeddings and LLMs to provide accurate, up-to-date context about Rust APIs and libraries via tool calls, ensuring AI-generated code references the latest available crate information.
