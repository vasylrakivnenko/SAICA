id: zed-agent
name: Zed Agent
tagline: Built-in agentic coding mode inside the Zed editor with rules.md and thread-based review.
description: >
  The agentic coding mode built into the Zed editor. Ships with
  thread-based conversations, per-project rules files (.rules /
  AGENT.md), inline diff review, tool-invocation approvals, and tight
  integration with Zed's multibuffer and language-server context.
  Supervision posture is graduated-HITL — agent proposes diffs and tool
  calls, user approves inline. Strong emphasis on keeping the human in
  the review loop via Zed's low-latency editor UX.

first_released: 2025-01-23
last_updated: 2026-04-10
maturity_status: stable

published_by: zed-industries
repository_url: https://github.com/zed-industries/zed
documentation_url: https://zed.dev/docs/ai/overview
license: GPL-3.0

control_paradigm: prevention
temporal_phase: pre_generation
autonomy_level: graduated_hitl

addresses_failure_modes:
  - scope_creep
  - context_pollution

locus_of_control:
  - context
  - human

implements_techniques:
  - project-rules
  - diff-review-gate
  - tool-allow-list
  - thread-based-context

security_notes: >
  Zed itself is open-source (GPL-3.0); the agent feature relies on user-
  configured model providers (Anthropic, OpenAI, local via Ollama). Code
  and prompts are sent to the chosen provider — pick accordingly for
  IP-sensitive repos. Tool-invocation gate is on by default; review
  custom slash-commands and MCP servers before installing.
signed_manifest: false
