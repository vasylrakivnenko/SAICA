inclusion_rationale: >
  Occupies prevention × pre_generation × graduated_hitl with a BYO-model
  posture that makes it the GPL-licensed counterweight to Cursor and
  Windsurf. Worth modeling as a distinct node because the editor is
  open-source, changing the supply-chain and data-egress threat model.
