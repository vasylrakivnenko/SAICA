id: browser-mcp
name: mcp
tagline: Browser MCP — an MCP server that lets AI applications control your browser.
description: >
  BrowserMCP is a community MCP server that exposes the running user's browser
  (via a browser extension) to AI applications. Differs from headless
  Playwright by running against the user's real logged-in session, which
  raises distinct supervision concerns.
first_released: '2025-03-28'
last_updated: '2025-04-24'
maturity_status: stable
published_by: browsermcp
repository_url: https://github.com/BrowserMCP/mcp
license: MIT
control_paradigm: prevention
temporal_phase: post_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - scope_creep
  - security_vulnerability
locus_of_control:
  - environment
implements_techniques:
  - mcp-server
  - browser-extension-bridge
  - real-session-access
stars: 6384
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Real-browser (non-headless) MCP cell: important point of contrast with
  playwright-mcp because the attack surface is the user's live session.
