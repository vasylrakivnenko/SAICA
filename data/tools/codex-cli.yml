id: codex-cli
name: Codex CLI
tagline: OpenAI's terminal coding agent with sandboxed auto-execution and iterative fix-loops.
description: >
  OpenAI's open-source terminal coding agent, shipping an auto-mode
  that runs code, reads errors, and iterates toward a working result
  inside a local sandbox. Supervision primitives: a workspace-write
  sandbox (Seatbelt on macOS, Landlock on Linux) that contains
  filesystem and network access, approval-policy toggles for higher-
  risk actions, and trajectory-logged sessions. Default posture in
  auto-mode is fully autonomous inside the sandbox with post-hoc
  human review.

first_released: 2025-04-16
last_updated: 2026-04-15
maturity_status: stable

published_by: openai
repository_url: https://github.com/openai/codex
documentation_url: https://github.com/openai/codex
license: Apache-2.0

control_paradigm: correction
temporal_phase: post_generation
autonomy_level: fully_autonomous

addresses_failure_modes:
  - logic_error
  - scope_creep

locus_of_control:
  - environment

implements_techniques:
  - sandboxed-runtime
  - iterative-fix-loop
  - approval-policy-modes
  - trajectory-logging

security_notes: >
  Open-source (Apache-2.0); runs locally and calls OpenAI's API.
  Workspace-write sandbox contains the agent to the project directory
  and blocks network by default — sandbox integrity is the primary
  supervision asset. Approval-policy "never" disables the gate and
  should only be paired with the sandbox; approval-policy "untrusted"
  is the shipped default. Audit any MCP servers added to the config.
signed_manifest: false
openssf_scorecard_score: null

cited_in: []
documented_in: []

inclusion_rationale: >
  Occupies correction × post_generation × fully_autonomous as OpenAI's
  official CLI coding agent. The Seatbelt/Landlock sandbox plus
  iterative fix-loop is the canonical "run-test-correct" recovery
  pattern at the interface layer, and it fills an important
  graduated_hitl-adjacent peer slot alongside Claude Code and Gemini
  CLI.
