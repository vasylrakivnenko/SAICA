id: guidance
name: Guidance
tagline: Programmable interleaving of prompt, control flow, and constrained generation.
description: >
  Python library for programming LLMs with interleaved text, control
  flow, regex/CFG constraints, and tool calls in a single program.
  Constraints (select, regex, grammar, JSON) are enforced at decoding
  time via logit masking against open-weights backends, and via
  token-healing to avoid tokenizer-boundary artifacts. Supports
  Transformers, llama.cpp, and remote providers where feasible.

