security_notes: >
  Open-source (MIT), originally from Microsoft Research, now under the
  guidance-ai org. Requires logit access for full constraint enforcement,
  so closed-API backends degrade to weaker modes. Programs execute local
  Python; treat third-party Guidance programs as untrusted code.
