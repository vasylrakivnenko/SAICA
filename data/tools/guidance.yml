inclusion_rationale: >
  Occupies prevention × in_generation × fully_autonomous alongside
  Outlines, but with a program-first ergonomics layer (interleaved
  prompting + constraints) rather than pure FSM compilation. Included to
  mark that the in-generation cell has multiple distinct approaches.
