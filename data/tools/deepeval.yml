stars: 14938
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies detection × post_generation × full_hitl as a unit-testing harness
  for LLM applications: developers write pytest-style assertions over 20+
  research-backed metrics (faithfulness, contextual recall/precision,
  hallucination, G-Eval chain-of-thought) and gate CI on them. Distinguished
  from observability-first peers (langfuse, langsmith) by centering test-case
  authoring rather than trace capture, and from braintrust by being
  open-source and Pytest-native. Useful as the canonical CI-gate exemplar for
  the post-generation evaluation cell.
