inclusion_rationale: >
  Canonical detection × post_generation × fully_autonomous exemplar for
  validator-retry on LLM output. Widely cited reference implementation of
  the "validate-then-reask" pattern, distinct from in-generation constrained
  decoding (Outlines/Guidance).
