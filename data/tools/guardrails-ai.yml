security_notes: >
  Open-source (Apache-2.0). Validator Hub pulls third-party validator
  packages at runtime — treat hub installs as supply-chain surface and pin
  to audited versions. Some validators call external APIs (e.g., toxicity
  classifiers) and exfiltrate model output to those endpoints; review each
  validator's network posture before enabling.
