id: guardrails-ai
name: Guardrails AI
tagline: Output validation framework with a catalog of validators and reask-on-failure loops.
description: >
  Python framework that wraps LLM calls and validates outputs against a
  declarative spec (Rail/XML or Pydantic). Ships a hub of reusable
  validators for PII, toxicity, topic, schema, JSON shape, and custom
  regexes. On validation failure, re-asks the model or raises. Primarily a
  post-generation detect-and-retry layer, not a decoding-time constraint.

