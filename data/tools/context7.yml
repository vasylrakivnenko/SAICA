inclusion_rationale: >
  Occupies the same prevention × pre_generation × fully_autonomous cell
  as ContextHub, with the same locus_of_control (context). Distinct
  from ContextHub by being a hosted, MCP-native service with broader
  language coverage; both belong in the catalog because they're
  structurally different bets on the doc-grounding problem (hosted
  index vs. self-hosted skill library). Surfaced by the v0.5.1
  long-tail enrichment pass (54k stars, originally buried at row
  2,488 of 2,675 candidates because it appeared in only 1 awesome-list).

