id: context7
name: Context7
tagline: Up-to-date, version-pinned library documentation for coding agents — delivered as an MCP server.
description: >
  Context7 is Upstash's MCP server that fetches current, version-pinned
  documentation for the libraries an agent is about to use, then injects
  it into the agent's context window before generation. Targets the same
  training-data-staleness root cause as Andrew Ng's ContextHub but ships
  as a hosted service plus open-source MCP client. Practitioners install
  the MCP server in their coding agent and invoke `use context7` in the
  prompt to ground generation in real, current API surfaces — guarding
  against fabricated APIs and obsolete-syntax suggestions.

