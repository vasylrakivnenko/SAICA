id: claude-code
name: Claude Code
tagline: Anthropic's agentic CLI with plan-mode, tool allow-lists, and graduated HITL.
description: >
  Coding agent CLI from Anthropic. Core supervision primitives: plan-mode
  (require approved plan before execution), tool allow-lists, per-action
  approval prompts, session memory via CLAUDE.md, and auto-mode for
  low-risk trajectories. Operates at graduated-HITL as a deliberate design
  choice.

first_released: 2025-02-24
last_updated: 2026-04-21
maturity_status: stable

published_by: anthropic
documentation_url: https://docs.claude.com/claude-code
license: proprietary

control_paradigm: prevention
temporal_phase: pre_generation
autonomy_level: graduated_hitl

addresses_failure_modes:
  - scope_creep
  - supply_chain_attack
  - context_pollution

locus_of_control:
  - environment
  - human

implements_techniques:
  - plan-mode
  - tool-allow-list
  - hitl-approval-gates
  - claude-md-context

composes_with:
  - context-hub

security_notes: >
  Proprietary vendor tool. Auto-mode and skills carry supply-chain
  implications — audit any skill or MCP server added to the installation.
  Opus 4.7 added cybersecurity auto-safeguards (2026-04-21 release).
signed_manifest: true
openssf_scorecard_score: null

inclusion_rationale: >
  Archetype of graduated-HITL coding agent. Useful as the reference point
  for the graduated_hitl autonomy level and for prevention × pre_generation
  tool-allow-list pattern.
