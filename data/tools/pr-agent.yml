id: pr-agent
name: pr-agent
tagline: AI-powered tool for automated pull-request analysis, feedback, and suggestions.
description: >
  pr-agent automates PR review using LLMs. It was published by CodiumAI
  (now Qodo) and today lives under the GitHub organisation The-PR-Agent. Produces
  structured code review, security hints, and test suggestions gated on a
  maintainer who approves diffs. Canonical exemplar for human-in-the-loop
  code-review supervision.
