id: windsurf
name: Windsurf
tagline: AI-native IDE with Cascade agent and flow-aware context indexing.
description: >
  Agentic code editor (formerly Codeium's editor, now Windsurf) built
  around the Cascade agent, which pairs inline edits with repo-scale
  retrieval from an always-on code index. Supervision primitives:
  project-level rules, per-action diff review, a Write/Chat/Legacy mode
  split that graduates tool access, and MCP server integration with
  allow-listing. Default posture is graduated-HITL — Cascade can chain
  multi-file edits but surfaces diffs for user accept/reject.

first_released: 2024-11-13
last_updated: 2026-04-05
maturity_status: stable

published_by: codeium
documentation_url: https://docs.windsurf.com
license: proprietary

control_paradigm: prevention
temporal_phase: pre_generation
autonomy_level: graduated_hitl

addresses_failure_modes:
  - scope_creep
  - fabrication
  - context_pollution

locus_of_control:
  - context
  - human

integration_surfaces:
  - desktop_app
implements_techniques:
  - project-rules
  - diff-review-gate
  - repo-indexing
  - cascade-agent-mode
  - mcp-allow-list

security_notes: >
  Proprietary IDE that ships source code to Codeium-operated model
  endpoints by default. Enterprise tier offers on-prem model routing
  and zero-retention policies. MCP integration expands the tool
  surface — audit any installed MCP server for supply-chain exposure.
  Auto-execute shell commands are opt-in; review the allow-list rather
  than enabling blanket auto-run.
signed_manifest: false
