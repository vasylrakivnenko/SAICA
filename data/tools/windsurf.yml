inclusion_rationale: >
  Occupies prevention × pre_generation × graduated_hitl as a direct
  peer to Cursor for the "agentic IDE" archetype. Cascade's flow-aware
  indexing is the load-bearing pre-generation context primitive that
  distinguishes Windsurf from diff-only coding assistants.
