id: langgraph
name: LangGraph
tagline: Graph-structured state machines for stateful multi-agent orchestration.
description: >
  Open-source orchestration library from LangChain for building stateful
  agent workflows as directed graphs with typed shared state, explicit
  nodes, and conditional edges. Supervision primitives: graph-state
  schema enforcement that scopes what each node can read/write,
  checkpointing for time-travel and replay, interrupt points for
  human-in-the-loop approval, and persistence for durable long-running
  runs. Positions itself as the disciplined alternative to unstructured
  agent loops.

