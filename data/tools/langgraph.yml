security_notes: >
  Open-source (MIT). Library code runs in-process with agent credentials;
  no hosted dependency required for core use, though LangGraph Cloud and
  LangSmith integration are opt-in hosted surfaces. Audit node
  implementations for tool-call and exfiltration surface — graph
  structure constrains control flow but not what individual nodes do.
signed_manifest: false
