inclusion_rationale: >
  Occupies prevention × pre_generation × fully_autonomous for the
  "structured agent orchestration" archetype. Graph-state schemas are a
  pre-generation contract: each node sees only declared state slices,
  which bounds context pollution and scope creep before generation
  rather than filtering outputs after.
