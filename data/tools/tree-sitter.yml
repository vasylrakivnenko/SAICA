supervises_targets:
  - javascript
  - typescript
  - python
  - go
  - rust
  - java
  - c
  - cpp
  - ruby

inclusion_rationale: >
  Occupies prevention x pre_generation x fully_autonomous for the
  dependency_blindness failure mode by providing the structural index
  that surfaces existing symbols, functions, and module exports before
  an agent reinvents them. Distinctive because it is the substrate many
  higher-level tools (LSPs, Sourcegraph SCIP emitters, grep-plus-AST
  linters) build on, which makes it the lowest-level entry point in the
  MECE grid for structural prevention - complementary to Semgrep
  (detection via custom rules) and sourcegraph-cody (retrieval grounding).
