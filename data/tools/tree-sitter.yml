id: tree-sitter
name: tree-sitter
tagline: Incremental parser toolkit that powers structural code analysis and symbol discovery.
description: >
  Parser generator and incremental parsing library that produces concrete
  syntax trees for 100+ languages fast enough to reparse on every
  keystroke. Used as the structural-analysis substrate inside editors
  (Neovim, Helix, Zed), language servers, and code-intelligence pipelines
  - including duplicate-function detection, symbol extraction for RAG, and
  dead-code/unused-import linters. Ships as a C core plus language-specific
  grammar crates and bindings for Rust, Python, Node, Go, and Swift.

first_released: 2018-10-01
last_updated: 2026-04-10
maturity_status: stable

published_by: tree-sitter
repository_url: https://github.com/tree-sitter/tree-sitter
documentation_url: https://tree-sitter.github.io/tree-sitter/
license: MIT

control_paradigm: prevention
temporal_phase: pre_generation
autonomy_level: fully_autonomous

addresses_failure_modes:
  - dependency_blindness

locus_of_control:
  - environment

implements_techniques:
  - incremental-parsing
  - concrete-syntax-tree
  - query-based-symbol-extraction
  - structural-code-search

security_notes: >
  MIT-licensed C library; grammars are community-maintained and compiled
  at build time. Running grammars on untrusted source is safe (pure
  parsing, no execution), but grammar-generation from .grammar.js uses
  node-gyp and should be pinned to audited grammar revisions to avoid
  supply-chain drift. No network access.
signed_manifest: false
openssf_scorecard_score: null

