  - scope_creep
  - context_pollution

locus_of_control:
  - environment
  - human

integration_surfaces:
  - cli
implements_techniques:
  - git-commit-per-change
  - repo-map
  - lint-test-autofix-loop
  - diff-review-gate

security_notes: >
  Open-source Python CLI. Runs locally against user-supplied API keys.
  Shell-command execution is gated by confirmation prompt by default;
  --yes-always disables the gate and should only be used inside a sandbox.
  Review pinned model and tokenizer deps for supply-chain drift.
signed_manifest: false
