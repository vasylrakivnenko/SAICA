inclusion_rationale: >
  Occupies correction × post_generation × graduated_hitl. Git-commit-per-change
  is the canonical recovery-via-VCS pattern for coding agents — reversal is
  cheap because every change is a separate commit, which converts logic
  errors from production incidents into trivial reverts.
