id: aider
name: Aider
tagline: Terminal coding agent with git-commit-per-change and repo-map context.
description: >
  Open-source CLI pair-programmer that edits files in a local git repo and
  auto-commits each LLM change as a discrete commit. Supervision primitives:
  repo-map for pre-generation context scoping, lint/test hooks that re-run
  after edits with auto-fix loops, /undo that maps to git revert, and
  explicit confirmation prompts for shell commands. Graduated-HITL by
  default — commits land but are trivially reversible.

first_released: 2023-05-06
last_updated: 2026-03-28
maturity_status: stable

published_by: paul-gauthier
