id: promptfoo
name: promptfoo
tagline: Test prompts, agents, and RAGs — red-teaming, pentesting, and vulnerability scanning for LLMs.
description: >
  Promptfoo is a CLI + library for testing, evaluating, and red-teaming LLM
  applications. Supports side-by-side prompt comparison, LLM-as-judge
  assertions, adversarial red-team generation, and CI integrations. Used by
  enterprises to gate LLM deployments on pre-prod evals.
