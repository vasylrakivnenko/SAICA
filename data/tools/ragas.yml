repository_url: https://github.com/explodinggradients/ragas
license: Apache-2.0
control_paradigm: detection
temporal_phase: post_generation
autonomy_level: full_hitl
addresses_failure_modes:
  - fabrication
  - logic_error
  - context_pollution
locus_of_control:
  - environment
implements_techniques:
  - rag-metrics
  - faithfulness
  - context-recall
  - context-precision
stars: 13605
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Canonical RAG-eval library. Complements deepeval (broad LLM eval) and
  autorag (pipeline search) by owning the faithfulness / context-precision
  metric family.
