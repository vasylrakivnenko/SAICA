id: ragas
name: ragas
tagline: Supercharge your LLM application evaluations — RAG- and agent-centric metrics.
description: >
  Ragas is an open-source evaluation framework for LLM applications with
  specialized metrics for RAG systems (faithfulness, context precision/recall,
  answer relevancy) and agent trajectories. Pytest-compatible, widely adopted
  in the RAG community, and frequently paired with tracing backends.
