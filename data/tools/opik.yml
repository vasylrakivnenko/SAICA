id: opik
name: opik
tagline: Debug, evaluate, and monitor LLM applications, RAG systems, and agentic workflows.
description: >
  Opik is Comet ML's open-source platform for debugging, evaluating, and
  monitoring LLM applications, RAG pipelines, and multi-agent workflows.
  Provides trace capture, LLM-as-judge graders, test dataset management, and
  production monitoring dashboards. Self-hostable alongside a SaaS offering.
