id: rebuff
name: Rebuff
tagline: LLM Prompt Injection Detector
description: Rebuff is a prompt injection detection system designed to identify and filter malicious injection attempts in LLM prompts before processing. It analyzes incoming prompts to detect adversarial patterns that could compromise application security or manipulate model behavior.
first_released: '2023-04-24'
last_updated: '2024-08-07'
maturity_status: experimental
repository_url: https://github.com/protectai/rebuff
license: Apache-2.0
control_paradigm: detection
temporal_phase: pre_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - security_vulnerability
locus_of_control:
  - prompt
  - environment
stars: 1464
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies detection × pre_generation × fully_autonomous with a four-stage
  ensemble for prompt-injection defense: heuristics, a dedicated classifier
  LLM, a vector store of prior attacks, and canary-token leak detection on
  the outbound side. Distinguished from last-layer (pure low-latency
  classifier) by trading latency for richer defense-in-depth, and from
  llm-guard by being injection-specialist rather than a general PII/toxicity
  suite. Useful anchor for the ensemble-detector style of pre-generation
  defense.
