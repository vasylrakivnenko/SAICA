inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous in the JS/TS lane.
  Tag basis (2026-11-20 tag audit, research/fm_tag_audit/final_table.csv):
  logic_error from the core 'possible problems' rules such as
  no-unreachable; security_vulnerability from no-eval and related rules
  (wider coverage needs third-party plugins); fabrication from no-undef,
  which flags names that do not exist; incomplete_execution from
  no-warning-comments, which flags TODO / FIXME and is off by default. The
  audit removed scope_creep: a linter has no notion of a task boundary.
  Mature workhorse; missing it leaves the audit detector unable to recognise
  the single most common JavaScript linting gate present in nearly every
  modern Node project.
editorial_notes: >
  Added 2026-05-01 to fill the package.json detection path so the
  audit no longer reports eslint as an unknown tool.
