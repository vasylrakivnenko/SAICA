id: eslint
name: ESLint
tagline: Pluggable JavaScript/TypeScript linter and code-quality enforcer.
description: >
  ESLint is the canonical JavaScript and TypeScript linter: it parses source
  to an AST and runs configurable rule plugins covering logic bugs (unused
  vars, unreachable code, mistaken equality), style consistency, and a
  growing set of security rules (eslint-plugin-security, no-eval). It runs
  from the CLI, in pre-commit, in CI, and as a language-server in editors.
  Configuration lives in `eslint.config.js` or `package.json`
  `eslintConfig`, which the audit detector now recognises.

