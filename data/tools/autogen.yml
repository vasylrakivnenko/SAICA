editorial_notes: >
  Upstream is archived (checked on GitHub 2026-11-21; last push 2026-11-12).
  The repository README says the project "has been archived and is no longer
  actively maintained by Microsoft" and names Microsoft Agent Framework
  (github.com/microsoft/agent-framework) as the successor; that project is
  not a node here. Licence: code MIT (LICENSE-CODE), documentation CC-BY-4.0
  (LICENSE). Status set to deprecated.
inclusion_rationale: >
  Occupies prevention × pre_generation × fully_autonomous for the
  conversation-centric multi-agent archetype. AutoGen scopes behavior via
  per-agent system messages and turn protocols rather than explicit
  role/task contracts, which is worth separating in the taxonomy.
