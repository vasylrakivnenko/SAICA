  - context_pollution

locus_of_control:
  - prompt
  - environment

implements_techniques:
  - conversable-agents
  - group-chat-manager
  - code-execution-config
  - actor-runtime
  - system-message-scoping

security_notes: >
  Open-source (MIT) from Microsoft Research. UserProxyAgent can execute
  code — configure code_execution_config to run inside a container
  (Docker) rather than on the host, or disable execution entirely for
  untrusted prompts. Check compatibility across the 0.2 → 0.4 rewrite
  when auditing existing integrations; the APIs are not identical.
signed_manifest: false
