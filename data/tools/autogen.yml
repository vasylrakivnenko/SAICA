id: autogen
name: AutoGen
tagline: Multi-agent conversation framework with programmable group chats.
description: >
  Microsoft Research open-source framework for building LLM applications
  as conversations between configurable agents (AssistantAgent,
  UserProxyAgent, GroupChat). Supervision primitives: per-agent system
  message scoping, conversable-agent turn control, code-execution config
  that gates whether an agent may run tools or code and in what
  environment, and GroupChatManager for bounded multi-agent discussion.
  v0.4 rewrote the core as an actor-model runtime (AgentChat on top of
  autogen-core).

first_released: 2023-09-25
last_updated: 2026-03-30
maturity_status: stable

published_by: microsoft
repository_url: https://github.com/microsoft/autogen
documentation_url: https://microsoft.github.io/autogen/
license: MIT

control_paradigm: prevention
temporal_phase: pre_generation
autonomy_level: fully_autonomous

addresses_failure_modes:
