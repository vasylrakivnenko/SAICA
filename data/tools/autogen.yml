inclusion_rationale: >
  Occupies prevention × pre_generation × fully_autonomous for the
  conversation-centric multi-agent archetype. Distinct locus from
  CrewAI: AutoGen scopes behavior via per-agent system messages and
  turn protocols rather than explicit role/task contracts, which is
  worth separating in the taxonomy.
