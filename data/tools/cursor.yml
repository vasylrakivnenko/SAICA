inclusion_rationale: >
  Occupies the prevention × pre_generation × graduated_hitl cell for the
  "agentic IDE" archetype. Project-rules pattern is a widely-copied
  pre-generation context primitive; diff-review is the canonical
  graduated-HITL gate at the interface layer.
