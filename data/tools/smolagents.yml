license: Apache-2.0

control_paradigm: detection
temporal_phase: post_generation
autonomy_level: fully_autonomous

addresses_failure_modes:
  - logic_error
  - fabrication

locus_of_control:
  - environment
  - prompt

implements_techniques:
  - code-as-action
  - authorized-imports-list
  - python-sandbox
  - planning-step-hook

security_notes: >
  Open-source (Apache-2.0). CodeAgent executes model-emitted Python —
  the default local executor only whitelists imports and is not a hard
  sandbox; for untrusted prompts use the E2B or Docker executor. Review
  the authorized-imports list per deployment; a broad list effectively
  grants the model arbitrary local-Python capability.
signed_manifest: false
