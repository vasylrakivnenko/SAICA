inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous for the
  "code-as-action" agent archetype. Distinct enough from JSON-tool-call
  frameworks that its supervision primitives (authorized-imports,
  Python sandbox) are worth modeling separately.
