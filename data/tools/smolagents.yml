id: smolagents
name: Smolagents
tagline: Minimalist code-agent library that expresses actions as executed Python.
description: >
  Hugging Face's minimalist agent framework (≈thousand lines of code)
  built around CodeAgent, which has the LLM emit Python snippets that
  are executed against a controlled tool namespace rather than producing
  JSON tool-call objects. Supervision primitives: a sandboxed Python
  executor (local or E2B/Docker), an explicit authorized-imports list,
  planning-step hooks, and trajectory inspection. Action-as-code gives
  richer composition but shifts the surface from JSON-schema validation
  to Python-sandbox integrity.

