id: mcp-toolbox
name: genai-toolbox
tagline: MCP Toolbox for Databases — open-source MCP server for databases.
description: >
  Google's genai-toolbox (MCP Toolbox) is an open-source MCP server that
  safely exposes database access to LLM agents. Provides per-tool allow-lists,
  schema-aware query generation, and auditable execution logs — turning direct
  DB access into a supervised interface.
