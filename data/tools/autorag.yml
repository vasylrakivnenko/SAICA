id: autorag
name: AutoRAG
tagline: Open-source framework for retrieval-augmented generation (RAG) evaluation and optimization.
description: >
  AutoRAG is an open-source framework that searches for the best RAG pipeline
  for a given dataset — grid-searches over retriever × reranker × generator
  combinations and scores each against ground-truth evals. Complements RAG
  observability tools by focusing on offline pipeline selection.
