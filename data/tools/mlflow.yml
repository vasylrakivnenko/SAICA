id: mlflow
name: mlflow
tagline: Open-source platform for the machine learning lifecycle — experiments, tracking, models, and LLM evaluation.
description: >
  MLflow is the open-source ML lifecycle platform stewarded by Databricks.
  Recent LLM-focused additions (MLflow 2.x) bring LLM tracing (OpenTelemetry),
  LLM evaluation, and a deployments registry — making it usable as an
  observability + eval backbone for LLM applications alongside classic ML.
