id: openlit
name: openlit
tagline: "Open-source AI engineering platform: OpenTelemetry-native LLM observability, guardrails, evaluations, prompt management."
description: >
  OpenLIT is a single open-source AI engineering platform that layers
  OpenTelemetry-native LLM observability, guardrails, evaluations, and prompt
  management on top of existing OTel collectors. Designed for teams that
  already have OTel infrastructure and want to extend it to LLM workloads
  without a separate control plane.
