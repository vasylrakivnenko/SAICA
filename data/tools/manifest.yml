id: manifest
name: manifest
tagline: Smart model routing for personal AI agents.
description: >
  Manifest is an open-source model-routing gateway for AI agents. Routes each
  request to the cheapest model that can handle it and falls back across
  providers on failure. Positions itself as a cost-control layer for
  personal/indie agent deployments.
