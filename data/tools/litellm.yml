id: litellm
name: litellm
tagline: Call any LLM using the OpenAI API format — proxy server and Python SDK.
description: >
  LiteLLM is an LLM proxy + Python SDK that exposes 100+ model providers
  behind the OpenAI API. Functions as an enterprise gateway with virtual keys,
  spend tracking, failover, and rate limits. De-facto standard for
  provider-agnostic LLM access.
