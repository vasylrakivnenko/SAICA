id: superagent
name: Superagent
tagline: Security layer protecting AI apps from prompt injection, data leaks, and harmful outputs.
description: A security wrapper that protects AI applications against prompt injections, data leaks, and harmful outputs. Developers embed this safety layer directly into their applications to enforce runtime security policies and demonstrate compliance.
first_released: '2023-05-10'
last_updated: '2026-04-11'
maturity_status: experimental
repository_url: https://github.com/superagent-ai/superagent
license: MIT
control_paradigm: prevention
temporal_phase: in_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - security_vulnerability
locus_of_control:
  - prompt
  - environment
stars: 6553
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies prevention × in_generation × fully_autonomous as an embedded
  security wrapper: developers link the library directly into the application
  so policy enforcement runs inline with the LLM call rather than behind a
  network proxy (contrast pipelock) or as a post-hoc validator (contrast
  guardrails-ai). Emphasizes compliance-ready runtime enforcement,
  distinguishing it from the detector-only posture of rebuff and last-layer,
  and making it a useful exemplar of in-process guardrail deployment.
