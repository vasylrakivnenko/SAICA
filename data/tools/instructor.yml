id: instructor
name: Instructor
tagline: Pydantic-typed structured output for LLM APIs with automatic retries.
description: >
  Thin Python library that patches LLM clients (OpenAI, Anthropic,
  Gemini, Cohere, Mistral, etc.) to return Pydantic models. Requests a
  tool/function-call response shape, parses, validates against the
  Pydantic schema, and retries with the validation error fed back as
  context on failure. Post-generation validation, not constrained
  decoding — relies on the provider's own JSON/tool-call mode for the
  initial shape.

