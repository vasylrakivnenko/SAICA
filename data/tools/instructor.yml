integration_surfaces:
  - library
implements_techniques:
  - pydantic-schema-validation
  - validator-retry-loop
  - function-calling-coercion

security_notes: >
  Open-source (MIT). Ships as a thin client patch — supply-chain surface
  is small but the library is broadly installed, so pin versions. Does
  not itself transmit data anywhere; all traffic goes through the
  underlying provider SDK whose posture applies.
signed_manifest: false
openssf_scorecard_score:

cited_in: []
documented_in: []

inclusion_rationale: >
  Detection × post_generation × fully_autonomous exemplar for the
  "Pydantic schema + reask on ValidationError" pattern. Useful contrast
  to PydanticAI (full agent framework) and to Outlines (in-generation
  constraints): Instructor is the minimal library expression of the
  validate-and-retry paradigm.
