id: logfire
name: logfire
tagline: Pydantic Logfire — observability for AI agents, LLMs, and Python apps built on OpenTelemetry.
description: >
  Pydantic Logfire is a Python-first observability platform from the Pydantic
  team, built on OpenTelemetry. First-class integration with Pydantic AI,
  LangChain, OpenAI, and FastAPI, making it a natural fit for Python-centric
  agent stacks. Captures LLM prompts/completions, tool calls, and general
  application traces.
