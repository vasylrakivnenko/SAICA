id: agentic-guardrails
name: Agentic Guardrails
tagline: Guardrails-based pipelines for agentic and RAG solutions addressing security risks and hallucinations.
description: A guardrails-based pipeline framework designed for agentic and RAG (Retrieval-Augmented Generation) solutions. The tool provides protective mechanisms to address security risks and prevent hallucinations in AI-generated outputs.
first_released: '2026-04-23'
maturity_status: experimental
repository_url: https://github.com/FareedKhan-dev/agentic-guardrails
license: NOASSERTION
control_paradigm: prevention
temporal_phase: post_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - fabrication
  - security_vulnerability
locus_of_control:
  - prompt
  - environment
inclusion_rationale: >
  Occupies the prevention × post_generation × fully_autonomous cell with a
  pipeline orientation: guardrails are chained into RAG/agent flows rather than
  attached as a single validator wrapper (contrast guardrails-ai) or a DSL of
  conversation rails (contrast nemo-guardrails). Novel framing is the
  explicit pipeline-of-guardrails composition pattern for agentic and
  retrieval-augmented stacks, useful as an exemplar of emerging
  modular-guardrail architectures.
