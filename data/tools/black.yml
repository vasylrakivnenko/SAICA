id: black
name: Black
tagline: Opinionated Python code formatter. Removes style argument from PR review.
description: >
  Black is the canonical opinionated Python formatter: it rewrites source
  to a single, deterministic style with no user-tunable formatting
  options. By collapsing the design space of "how should this look,"
  Black prevents scope creep in code review (style nits) and removes a
  whole class of agent-introduced cosmetic diffs. Configuration lives
  in `pyproject.toml [tool.black]`, which the audit detector now
  recognises.

