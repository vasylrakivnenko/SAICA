inclusion_rationale: >
  Occupies prevention × pre_generation × graduated_hitl as Google's
  official counterpart to Claude Code and Codex CLI. Worth modeling
  separately because the tool ecosystem, defaults, and sandbox
  posture are materially different, and because it is the canonical
  Gemini-family terminal agent.
