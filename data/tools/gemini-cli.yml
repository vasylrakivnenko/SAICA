id: gemini-cli
name: Gemini CLI
tagline: Google's official terminal coding agent built on Gemini with MCP and tool-allow-list supervision.
description: >
  Open-source terminal coding agent from Google, pairing the Gemini
  model family with a tool-use loop, MCP integration, and a YOLO/
  approval-mode toggle for shell-command gating. Supervision primitives:
  per-action approval prompts, tool allow-lists, a GEMINI.md-style
  context file for project scoping, and an explicit sandbox option via
  Docker. Graduated-HITL by default with the option to drop to full
  autonomy inside a sandbox.

