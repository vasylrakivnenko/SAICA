security_notes: >
  Open-source (Apache-2.0) CLI; runs locally and calls Google's Gemini
  API by default. Approval-mode is on by default; YOLO mode disables
  the gate and should only be used inside the Docker sandbox option.
  MCP server installation expands the tool surface — audit any
  installed server for supply-chain exposure.
