id: openai-evals
name: evals
tagline: Framework for evaluating LLMs and LLM systems, plus an open registry of benchmarks.
description: >
  OpenAI Evals is a framework for evaluating LLMs and LLM systems and a
  community registry of benchmarks. Supports both traditional reference
  graders and model-graded evals. Distinct from lm-evaluation-harness by
  emphasizing user-contributed evals over a fixed benchmark suite.
