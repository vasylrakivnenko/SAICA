id: outlines
name: Outlines
tagline: Constrained decoding via finite-state machines over regex, JSON Schema, and CFGs.
description: >
  Python library for structured generation that compiles regex, JSON
  Schema, or a context-free grammar into a finite-state machine and masks
  the LLM's logits at every decoding step so only tokens leading to valid
  output can be sampled. Output is guaranteed to match the schema by
  construction — no retry loop required. Backends include Transformers,
  vLLM, llama.cpp, MLX, and a hosted service (.txt).

