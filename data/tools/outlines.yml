inclusion_rationale: >
  Canonical prevention × in_generation × fully_autonomous exemplar:
  logit-masking during decoding prevents schema-invalid tokens from ever
  being emitted. Distinct from post-generation validators — output is
  correct-by-construction rather than checked-after-the-fact.
