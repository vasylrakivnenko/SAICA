security_notes: >
  Open-source (Apache-2.0). Requires access to model logits, so it works
  with open-weights backends (Transformers/vLLM/llama.cpp) but not with
  closed APIs that don't expose logit bias. FSM compilation happens
  locally; no data leaves the process. Hosted .txt service is a separate
  SaaS with its own data-handling posture.
