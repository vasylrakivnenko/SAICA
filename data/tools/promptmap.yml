id: promptmap
name: promptmap
tagline: Security scanner for custom LLM applications.
description: >
  Promptmap is a CLI security scanner for custom LLM apps. Discovers system
  prompt leakage, prompt injection, and jailbreaks across user-provided
  endpoints. Designed for app-sec teams who want a quick adversarial sweep of
  their production LLM feature.
