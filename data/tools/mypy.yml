id: mypy
name: mypy
tagline: Static type checker for Python. Catches mismatched types before runtime.
description: >
  mypy is the original gradual-typing checker for Python, reading PEP 484
  type hints across a project and reporting type-incompatibility,
  missing-attribute, and contract-mismatch errors before code runs. It
  guards against logic errors caused by silent type drift and against
  fabricated APIs (calls to attributes that do not exist). Configuration
  lives in `pyproject.toml [tool.mypy]`, which the audit detector now
  recognises.

first_released: 2012-04-01
last_updated: 2026-04-15
maturity_status: stable

published_by: python
repository_url: https://github.com/python/mypy
documentation_url: https://mypy.readthedocs.io/
license: MIT

control_paradigm: detection
temporal_phase: post_generation
autonomy_level: fully_autonomous

addresses_failure_modes:
  - logic_error
  - fabrication

locus_of_control:
  - environment

integration_surfaces:
  - cli
  - ci_app
  - ide_plugin

implements_techniques:
  - static-type-checking
  - gradual-typing
  - type-inference
  - stub-resolution

security_notes: >
  Standard dev-tool security posture; no special considerations. mypy
  runs locally and does not execute target code, only parses and walks
  its AST.
signed_manifest: false
openssf_scorecard_score:

cited_in: []
