id: mypy
name: mypy
tagline: Static type checker for Python. Catches mismatched types before runtime.
description: >
  mypy is the original gradual-typing checker for Python, reading PEP 484
  type hints across a project and reporting type-incompatibility,
  missing-attribute, and contract-mismatch errors before code runs. It flags
  fabricated APIs (attributes, names and modules that do not exist) and,
  with the opt-in `deprecated` error code (PEP 702), use of deprecated APIs.
  Configuration lives in `pyproject.toml [tool.mypy]`, which the audit
  detector now recognises.

