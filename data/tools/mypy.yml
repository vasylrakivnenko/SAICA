inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous for logic_error
  and fabrication in the Python lane. The reference implementation of
  PEP 484; missing it leaves the audit detector unable to recognise the
  most widely-deployed Python type-checking gate.
editorial_notes: >
  Added 2026-05-01 to fill the pyproject `[tool.*]` detection path so
  the audit no longer reports mypy as an unknown tool.
