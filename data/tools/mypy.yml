inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous for fabrication
  and obsolescence in the Python lane. The 2026-11-20 tag audit removed
  logic_error: that mode is code that passes the type check and is still
  wrong, and mypy finds type errors (research/fm_tag_audit/final_table.csv).
  The reference implementation of PEP 484; missing it leaves the audit
  detector unable to recognise the most widely-deployed Python type-checking
  gate.
editorial_notes: >
