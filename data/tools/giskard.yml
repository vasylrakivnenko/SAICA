id: giskard
name: giskard-oss
tagline: Open-source evaluation and testing library for LLM agents and ML models.
description: >
  Giskard is an open-source testing library originally for tabular ML,
  extended to cover LLM apps and agents. Runs pre-defined robustness, bias,
  and hallucination tests and generates regression reports. Used in CI to gate
  ML/LLM deployments.
