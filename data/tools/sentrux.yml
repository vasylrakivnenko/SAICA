inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous for
  cascading_failure (continuous architectural metrics let an agent
  detect that its own session regressed quality before the next
  edit) and dependency_blindness (the redundancy metric flags
  scattered re-implementations of the same concept across files).
  Distinct from langfuse / helicone (LLM-call observability) by
  observing the *codebase structure* rather than the model trace,
  and from semgrep / tree-sitter (rule-or-pattern static analysis)
  by emitting a continuous live score plus session-baseline diff
  rather than discrete pass/fail findings. The CI-gate mode shifts
  the same binary toward prevention and graduated_hitl; if that
  use-case grows we may split it into a second Tool node per the
  MECE policy.

