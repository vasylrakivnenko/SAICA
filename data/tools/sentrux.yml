security_notes: >
  Pure Rust, single binary, runs fully local. Reads source files
  read-only; the MCP server exposes scan/session/rules tools but no
  filesystem write capability. Rules and constraints live as a
  human-authored `.sentrux/rules.toml` in the repo. No telemetry is
  documented in the README; verify before shipping into a regulated
  environment.
