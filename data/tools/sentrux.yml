id: sentrux
name: sentrux
tagline: Real-time architectural sensor that scores codebase modularity, acyclicity, and redundancy as the agent writes.
description: >
  Pure-Rust CLI plus MCP server that watches a codebase's structural
  health in real time and emits a single 0–10000 quality signal
  computed from five root-cause metrics (modularity, acyclicity,
  depth, equality, redundancy). Ships an interactive treemap GUI, a
  CI-friendly rules engine (`.sentrux/rules.toml` declares
  max-cycles, layer order, forbidden boundaries, god-file thresholds)
  and a session-baseline gate (`sentrux gate`) that flags
  architectural regression between agent runs. MCP integration
  exposes nine tools (scan, health, session_start/end, rescan,
  check_rules, evolution, dsm, test_gaps), letting Claude Code,
  Cursor, Windsurf, and OpenCode read the sensor signal and
  self-correct without a human in the loop. 52 languages via
  tree-sitter plugins.

