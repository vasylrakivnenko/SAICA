inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous for logic_error in
  the Python lane. For incomplete_execution and test_manipulation it only
  records evidence (skip and xfail counts); the 2026-11-20 tag audit moved
  both to records_failure_modes (research/fm_tag_audit/final_table.csv).
  Mature workhorse; missing it leaves the audit detector unable to recognise
  the single most common testing configuration in Python repos.
editorial_notes: >
