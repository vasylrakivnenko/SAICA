id: pytest
name: pytest
tagline: Python test framework — discipline gate for "done means tests pass."
description: >
  pytest is the de facto Python test framework: it discovers and runs unit,
  integration, and functional tests, reporting failures in human-readable
  form. It is the usual gate for the "done means tests pass" rule: failing
  assertions show logic errors that only appear when code runs. Its summary
  also counts skipped and xfailed tests, which a person can read for
  unfinished work or weakened tests; pytest cannot tell a legitimate skip
  from a manipulated test. Configuration lives in `pyproject.toml
  [tool.pytest.ini_options]`, which the audit detector now recognises.

