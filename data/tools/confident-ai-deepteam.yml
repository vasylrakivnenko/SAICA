security_notes: >
  Open-source (Apache-2.0). The framework generates adversarial
  prompts at scale — intended strictly for systems under test. Calls
  the model-under-test plus a judge model; budget token spend
  accordingly. Attack corpora evolve with upstream releases; pin
  versions for reproducible audit evidence.
