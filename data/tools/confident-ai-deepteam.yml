id: confident-ai-deepteam
name: DeepTeam
tagline: Open-source LLM red-teaming framework from Confident AI with 40+ attack vulnerabilities.
description: >
  Open-source red-teaming framework for LLM applications, from the
  authors of DeepEval. Ships a library of vulnerabilities (prompt
  injection, jailbreak, PII leakage, bias, toxicity, misinformation,
  excessive agency, unauthorized actions) and attack enhancement
  strategies (multi-turn, roleplay, encoding, linguistic obfuscation)
  that stress-test an LLM under test via programmatic attack agents.
  Findings are emitted as scored reports suitable for pre-deployment
  gating and continuous-evaluation harnesses.

