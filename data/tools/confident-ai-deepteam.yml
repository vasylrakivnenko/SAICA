inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous with a
  red-team-specialist locus that no other modeled node covers.
  Adversarial pre-deployment scanning is analytically distinct from
  trace-capture observability — it proactively synthesizes attack
  inputs rather than sampling production traffic — and maps cleanly
  onto the security_vulnerability and supply_chain_attack failure
  modes.
