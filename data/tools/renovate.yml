  - bundler
  - composer
  - nuget
  - docker
  - github-actions
  - terraform

inclusion_rationale: >
  Occupies detection x post_generation x graduated_hitl alongside Dependabot
  but with config-first ergonomics and cross-forge reach (GitLab, Bitbucket,
  Azure DevOps), filling the same MECE cell for teams that are not on GitHub
  or need update-grouping that Dependabot does not express. Its broader
  manager coverage (Terraform, Helm, GitHub Actions digests) extends
  obsolescence mitigation into infrastructure-as-code manifests that pure
  application-package tools miss.
