id: renovate
name: Renovate
tagline: Highly configurable multi-platform dependency update bot.
description: >
  Open-source dependency-update bot from Mend (formerly WhiteSource) that
  scans repositories across GitHub, GitLab, Bitbucket, Azure DevOps, and
  Gitea, then opens PRs/MRs to bump outdated packages. Supports 90+
  package managers and offers fine-grained config for grouping,
  scheduling, automerge rules, and vulnerability-only alerts via a
  JSON/JSON5 renovate.json file. Self-hostable as a CLI or Docker image;
  a hosted Mend Renovate App is also available for GitHub.

first_released: 2017-03-01
last_updated: 2026-04-18
maturity_status: stable

published_by: mend
repository_url: https://github.com/renovatebot/renovate
documentation_url: https://docs.renovatebot.com
license: AGPL-3.0

control_paradigm: detection
temporal_phase: post_generation
autonomy_level: graduated_hitl

addresses_failure_modes:
  - obsolescence
  - supply_chain_attack

locus_of_control:
  - environment

integration_surfaces:
  - ci_app
implements_techniques:
  - dependency-version-diff
  - cve-advisory-matching
  - automated-pull-request
  - config-driven-grouping
  - scheduled-update-batches

security_notes: >
  AGPL-3.0 core; the Mend-hosted app adds proprietary enrichment. Bot
  runs with repo write scope to open PRs; self-hosted deployments keep
  manifest data on-prem. Automerge configurations must be scoped (e.g.,
  devDependencies patch only) so that compromised upstream releases are
  not merged without human review - the same supply-chain caveat applies
  as with any auto-updater.
signed_manifest: false
