id: playwright-mcp
name: playwright-mcp
tagline: Playwright Model Context Protocol server from Microsoft.
description: >
  Microsoft Playwright MCP is the official MCP server wrapping Playwright.
  Exposes a controlled set of browser actions to LLM agents (click, type,
  navigate, screenshot) through MCP, so agent access to the browser is
  channelled through an auditable tool interface.
