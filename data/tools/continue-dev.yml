inclusion_rationale: >
  Occupies prevention × pre_generation × graduated_hitl for the
  open-source IDE-agent archetype. Complements closed IDE agents
  (Cursor, Copilot) by offering user-owned model routing and
  configurable context providers — the supervision locus shifts to
  the integrator, which is a meaningfully different posture.
