security_notes: >
  Open-source (Apache-2.0) IDE extension. Code and context are sent to
  whichever model provider the user configures — local via Ollama/LM
  Studio or hosted via OpenAI/Anthropic/etc. MCP integration pulls
  third-party servers into the trust boundary; audit each server's
  capabilities. The Continue Hub is a separate content-distribution
  surface — pin asset versions to avoid supply-chain drift.
