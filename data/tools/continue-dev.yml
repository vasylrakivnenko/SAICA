id: continue-dev
name: Continue
tagline: Open-source IDE assistant with configurable providers, rules, and context.
description: >
  Open-source IDE extension for VS Code and JetBrains that provides
  chat, autocomplete, edit, and agent modes backed by user-configured
  model providers (local or hosted). Supervision primitives:
  config.yaml / config.json-declared context providers, rules blocks
  that inject project-specific guidance, custom slash commands, an
  MCP-server integration layer, and per-edit diff review. Positions as
  the configurable open alternative to closed IDE agents.

