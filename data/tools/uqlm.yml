id: uqlm
name: uqlm
tagline: Uncertainty Quantification for Language Models.
description: >
  UQLM (by CVS Health) is a Python package for uncertainty quantification of
  LLM outputs. Implements black-box, white-box, and semantic-similarity-based
  uncertainty estimators so downstream code can abstain, escalate to human
  review, or request clarification when confidence is low.
