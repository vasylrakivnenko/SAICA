id: pipelock
name: PipelineLock
tagline: Firewall for AI agents with DLP, SSRF protection, MCP scanning, and prompt injection blocking.
description: A firewall for AI agents providing DLP scanning, SSRF protection, bidirectional MCP scanning, tool poisoning detection, and prompt injection blocking. Acts as a security layer between AI agents and external systems to prevent various attack vectors.
first_released: '2026-02-08'
last_updated: '2026-04-23'
maturity_status: experimental
repository_url: https://github.com/luckyPipewrench/pipelock
license: Apache-2.0
control_paradigm: prevention
temporal_phase: in_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - security_vulnerability
  - supply_chain_attack
locus_of_control:
  - environment
stars: 340
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies prevention × in_generation × fully_autonomous as a network-plane
  firewall specifically for AI-agent traffic: DLP and SSRF inspection plus
  bidirectional MCP scanning and tool-poisoning detection. Distinguished from
  prompt-oriented detectors (rebuff, last-layer) by sitting between the agent
  and the outside world rather than in front of the prompt, and distinct from
  socket (which scans package manifests at adoption time) by operating at the
  live request layer. Surfaces tool-poisoning through MCP as a first-class
  vector worth its own supervision node.
