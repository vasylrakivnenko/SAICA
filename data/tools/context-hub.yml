id: context-hub
name: Context Hub
tagline: Up-to-date, curated API docs for coding agents.
description: >
  CLI and protocol that gives coding agents curated, versioned,
  LLM-optimized API documentation. Primitives: docs, skills, annotations,
  feedback. Addresses the training-data-staleness root cause of
  fabrication and obsolescence at the pre-generation phase.

