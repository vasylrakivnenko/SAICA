inclusion_rationale: >
  Occupies detection x post_generation x fully_autonomous for
  security_vulnerability: the rule registry flags injection, weak crypto and
  secrets on the finished diff (the Community Edition analyses one file at a
  time; cross-file dataflow is in the paid engine). The supply_chain_attack
  tag rests on Semgrep Supply Chain, a commercial part of the AppSec
  Platform, not on the open-source engine this record describes. The
  2026-11-20 tag audit removed dependency_blindness: no shipped rule flags
  re-implemented library functionality; that would need custom rules per
  codebase (research/fm_tag_audit/final_table.csv).
