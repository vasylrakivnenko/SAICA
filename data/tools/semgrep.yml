id: semgrep
name: Semgrep
tagline: Fast, rule-based static analysis with a pattern syntax that mirrors source code.
description: >
  Open-source static-analysis engine that matches syntactic and
  lightweight-dataflow patterns written in a source-code-like DSL, spanning
  30+ languages. Ships a large community rule registry (OWASP Top 10,
  secrets, framework anti-patterns) and supports custom rules. Runs in CLI,
  pre-commit, and CI; Semgrep AppSec Platform adds hosted findings triage.

first_released: 2020-03-17
last_updated: 2026-11-20
