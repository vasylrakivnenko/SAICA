inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous in the Python
  lane. Tag basis (2026-11-20 tag audit,
  research/fm_tag_audit/final_table.csv): logic_error from the
  flake8-bugbear and pyflakes rule families; fabrication from undefined-name
  (F821); obsolescence from the deprecated-import and pyupgrade rules;
  security_vulnerability from the flake8-bandit (S) rules;
  incomplete_execution from the TODO / FIXME rules. The audit removed
  scope_creep: a linter has no notion of task scope. Mature workhorse rather
  than novel research, but missing it leaves the audit detector blind to the
  most common `pyproject.toml [tool.ruff]` configuration in modern Python
  repos (e.g. openai-python).
editorial_notes: >
  Added 2026-05-01 to fill the pyproject `[tool.*]` detection path so
  the audit no longer reports ruff as an unknown tool.
