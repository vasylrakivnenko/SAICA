id: phoenix
name: phoenix
tagline: AI observability and evaluation — open-source OTEL-native LLM tracing, evals, and experiments.
description: >
  Arize Phoenix is the open-source OpenTelemetry-native observability and
  evaluation platform from Arize AI. Runs locally or in production to trace
  LLM/agent calls, evaluate prompts with built-in graders, and run experiments
  on datasets. Complements Arize AX (paid cloud) and is frequently paired with
  OpenInference instrumentation across LangChain, LlamaIndex, OpenAI, and
  Anthropic.
