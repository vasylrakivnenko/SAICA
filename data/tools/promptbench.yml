id: promptbench
name: promptbench
tagline: Unified evaluation framework for large language models with adversarial perturbations.
description: >
  Microsoft PromptBench is a framework to benchmark LLM robustness under
  adversarial prompt perturbations. Evaluates stability, robustness, and
  reliability with defined attack taxonomies and measures prompt sensitivity
  of outputs.
