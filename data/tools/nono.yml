id: nono
name: nono
tagline: Capability-based sandbox for securely running AI agents with zero setup
description: nono is a capability-based, multiplexing sandbox tool designed for developers to securely run AI agents. It provides zero-setup security isolation enabling a seamless path from development to production without additional infrastructure or latency overhead.
first_released: '2026-01-31'
last_updated: '2026-04-23'
maturity_status: experimental
repository_url: https://github.com/always-further/nono
license: Apache-2.0
control_paradigm: prevention
temporal_phase: in_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - security_vulnerability
  - scope_creep
locus_of_control:
  - environment
integration_surfaces:
  - cli
  - library
stars: 2085
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies prevention × in_generation × fully_autonomous as a capability-based
  sandbox that mediates an agent's syscalls while it is still acting, rather
  than isolating a whole job at the container boundary (contrast modal, e2b,
  daytona, which sit in recovery × post_generation). The novel primitive is
  zero-setup multiplexed capability enforcement so a single host can safely
  run many concurrent agent sessions without per-agent VM provisioning, useful
  as the local-dev-mode exemplar of in-generation environment control.
