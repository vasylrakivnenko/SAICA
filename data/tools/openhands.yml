id: openhands
name: OpenHands
tagline: Open autonomous software-engineering agent platform with sandboxed runtime.
description: >
  Open-source agent platform (formerly OpenDevin) for autonomous software
  engineering. Ships a Docker/Kubernetes-backed sandbox runtime where agents
  execute shell, file, and browser actions; a microagent system for scoped
  task knowledge; a trajectory log for post-hoc audit; and a delegation
  protocol for multi-agent composition. Default posture is fully_autonomous
  long-horizon task execution, with optional confirmation-mode gates.

first_released: 2024-03-13
last_updated: 2026-04-02
maturity_status: stable

published_by: all-hands-ai
repository_url: https://github.com/All-Hands-AI/OpenHands
documentation_url: https://docs.all-hands.dev
license: MIT

control_paradigm: recovery
temporal_phase: post_generation
autonomy_level: fully_autonomous

addresses_failure_modes:
  - scope_creep
  - security_vulnerability
  - logic_error
  - supply_chain_attack

locus_of_control:
  - environment

implements_techniques:
  - sandboxed-runtime
  - trajectory-logging
  - microagent-scoped-context
  - confirmation-mode

security_notes: >
  Open-source, Apache-licensed. Default runtime is a containerized sandbox;
  host-mounted workspaces and direct host execution bypass that isolation
  and should be avoided outside trusted environments. The agent has broad
  shell access inside the sandbox — treat sandbox escape and credential
  leakage as the primary threat model.
signed_manifest: false
openssf_scorecard_score: null

cited_in: []
documented_in: []

inclusion_rationale: >
  Canonical recovery × post_generation × fully_autonomous exemplar for
  open-source autonomous coding agents. The container-sandboxed runtime
  converts arbitrary agent missteps from host-level incidents into
  disposable-container recovery events.
