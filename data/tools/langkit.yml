id: langkit
name: LangKit
tagline: Open-source toolkit for monitoring LLMs, extracting safety and quality signals from prompts and responses.
description: LangKit is an open-source text metrics toolkit for extracting features from LLM prompts and responses to enable monitoring, observability, and security analytics. It provides metrics for text quality, relevance, sentiment analysis, and safety signals to support LLM observability workflows.
first_released: '2023-04-26'
last_updated: '2024-11-22'
maturity_status: experimental
repository_url: https://github.com/whylabs/langkit
license: Apache-2.0
control_paradigm: detection
temporal_phase: post_generation
autonomy_level: fully_autonomous
addresses_failure_modes:
  - security_vulnerability
locus_of_control:
  - environment
stars: 984
stars_updated_at: '2026-04-23'
inclusion_rationale: >
  Occupies detection × post_generation × fully_autonomous as a text-metrics
  library feeding the whylogs/WhyLabs monitoring stack. Distinguished from
  trace-oriented observability (langfuse, langsmith, helicone, arize-phoenix)
  by operating one level lower: it extracts numeric features (readability,
  sentiment, relevance, jailbreak signal) from prompts/responses so downstream
  data-observability tools can profile and alert on drift. Useful reference
  point for the metrics-extraction layer beneath trace dashboards.
