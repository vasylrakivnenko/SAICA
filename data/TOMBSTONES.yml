# Nodes removed from the knowledge graph.
#
# Policy (EDITORIAL_POLICY.md, "Removal and deprecation"): nodes are never
# silently deleted. Every node removed from data/<kind>/ gets one entry here.
# An id listed here must never be reused for a different node.
#
# Fields: id, kind (tool | failure_mode | paper | taxonomy | crosswalk |
# incident | recipe), removed_on, reason, successor (node id or null),
# archived_at (path of the kept copy, if any), evidence (where the check
# is written down), commit (the commit that deleted the file, if it was
# deleted in an earlier commit).
#
# Coverage: every tool, paper and recipe file deleted from data/ in git
# history is listed (82 entries back-filled on 2026-11-21 from
# `git log --diff-filter=D --name-only -- data/`: 75 tools, 6 recipes,
# 1 paper; `commit` is the commit that deleted the file and `reason` is
# taken from its message), plus the five incidents retracted on 2026-11-21.
# The removed files can be read with `git show <commit>^:data/<kind>/<id>.yml`.

tombstones:
  - id: daplab-cascading-recovery-observation-2026
    kind: incident
    removed_on: 2026-11-21
    reason: >
      Retracted. The record said the Columbia DAPLab post "9 Critical
      Failure Patterns of Coding Agents" reported a "Cascading Error
      Recovery" pattern (fix attempts that add new errors). The post has no
      such pattern. First retracted on 2026-08-18 in commit 00422e2, which
      never reached main.
    successor: null
    archived_at: archive/retracted-incidents/daplab-cascading-recovery-observation-2026.yml
    evidence: archive/retracted-incidents/README.md

  - id: daplab-destructive-action-observation-2026
    kind: incident
    removed_on: 2026-11-21
    reason: >
      Retracted. The record said the DAPLab post catalogued agents running
      destructive commands (recursive delete, force-push, hook bypass,
      database DROP) without approval. The post describes nothing of the
      kind. First retracted on 2026-08-18 in commit 00422e2.
    successor: null
    archived_at: archive/retracted-incidents/daplab-destructive-action-observation-2026.yml
    evidence: archive/retracted-incidents/README.md

  - id: daplab-fabricated-references-observation-2026
    kind: incident
    removed_on: 2026-11-21
    reason: >
      Retracted. The record said the DAPLab post reported a "Fabricated
      References" pattern (calls to functions or packages that do not
      exist). The post has no such pattern; its only related remark is that
      agents may "hallucinate fake inputs like environment variables or API
      keys". First retracted on 2026-08-18 in commit 00422e2.
    successor: null
    archived_at: archive/retracted-incidents/daplab-fabricated-references-observation-2026.yml
    evidence: archive/retracted-incidents/README.md

  - id: daplab-incomplete-task-execution-observation-2026
    kind: incident
    removed_on: 2026-11-21
    reason: >
      Retracted. The record said the DAPLab post found that every agent it
      tested claimed completion with subtasks undone. The post has no such
      pattern. First retracted on 2026-08-18 in commit 00422e2.
    successor: null
    archived_at: archive/retracted-incidents/daplab-incomplete-task-execution-observation-2026.yml
    evidence: archive/retracted-incidents/README.md

  - id: daplab-silent-test-passing-observation-2026
    kind: incident
    removed_on: 2026-11-21
    reason: >
      Retracted. The record said the DAPLab post documented agents editing
      or weakening failing tests ("Silent Test-Passing Workaround"). The
      post does not mention tests being edited. First retracted on
      2026-08-18 in commit 00422e2.
    successor: null
    archived_at: archive/retracted-incidents/daplab-silent-test-passing-observation-2026.yml
    evidence: archive/retracted-incidents/README.md

