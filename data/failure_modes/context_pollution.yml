id: context_pollution
name: Context pollution
tagline: Trajectory drift, hallucination spirals, overlong or off-task context.
description: >
  The agent's working context degrades over a session — relevant prior
  information is dropped, irrelevant material accumulates, or hallucinations
  from earlier turns are treated as ground truth in later turns. Failure of
  in-session state hygiene, not of a single generation.

prior_work:
  - cemri-2025-mast
  - zhu-2025-agent-error-taxonomy

detection_signals:
  - Later turns reference facts or code that never existed in user input or tool output.
  - Token-budget pressure truncates prior turns containing still-relevant context.
  - Agent repeats a failed tool call multiple times with identical arguments.
  - Session duration exceeds a threshold at which attention-over-context is empirically unreliable for the model.

crosswalks:
  - taxonomy: owasp-agentic-top-10-2026
    external_id: ASI06
    confidence: partial
    note: OWASP "Memory & Context Poisoning" covers adversarial manipulation; context_pollution covers accidental drift as well.
  - taxonomy: mast
    external_id: MAST-FM-13
    confidence: exact
    note: MAST Context Loss is the direct counterpart.
  - taxonomy: daplab-9-patterns
    external_id: DAP-05
    confidence: exact
    note: DAPLab Context Window Overflow is the direct counterpart.
