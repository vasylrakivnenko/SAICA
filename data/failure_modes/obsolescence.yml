id: obsolescence
name: Obsolescence
tagline: Using deprecated APIs, retired packages, or outdated library versions — often because the model's training data pre-dates current releases.
description: >
  The agent emits code that references real APIs or packages that have been
  deprecated, removed, or materially changed in their recommended version.
  The root cause is frequently training-data staleness: the model saw a
  library version that has since been superseded, and it confidently emits
  the older form. Distinct from fabrication (non-existent) and from
  dependency_blindness (real-and-current-but-ignored).
  This mode is a tag, not an exclusive class: one failure can carry several
  modes (see related_modes).

aliases:
  - stale-training-knowledge
  - training-cutoff-drift
  - version-drift
  - deprecated-api-usage
  - library-evolution-lag

related_modes:
  - fabrication
  - dependency_blindness

prior_work:
  - wang-2024-llms-meet-library-evolution
  - liu-2024-beyond-functional-correctness

detection_signals:
  - Imported API is marked deprecated in the target library's current release notes.
  - Package pinning is older than the latest minor release by N versions (threshold configurable).
  - Language-server or linter emits a deprecation warning.
  - Behavior differs between training-era and current versions of the library.
