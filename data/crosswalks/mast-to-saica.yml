# Re-judged 2026-11-21 against the published MAST (arXiv 2503.13657v3,
# Appendix A definitions). MAST describes the behaviour of agents in a
# multi-agent run; SAICA modes describe what a coding agent does to a
# codebase. So "exact" is used only where a MAST annotator and a SAICA
# labeller would tag the same incident. See
# research/review_20261121/mast_fix.md for the old -> new history.
#
# Changed later the same day (fix round, E4):
#   FM-3.1 <-> incomplete_execution lowered from exact to partial: MAST
#     does not require the false "done" claim that defines the SAICA mode,
#     and it covers early stops that SAICA would not label.
#   FM-1.2 <-> scope_creep lowered from partial to related: a role is not
#     the user's task boundary; FM-1.1 is the closer entry.
#   The list of categories left out moved from this comment to `unmapped`.
# No row is "exact" now. Labels and definitions in the taxonomy file were
# compared with the v3 PDF again by script (17 of 17 match).
# Drafted by an LLM. No person has reviewed these rows yet.

id: mast-to-saica
saica_axis: failure_mode
taxonomy: mast
authored_by:
  - claude-opus-4-7
  - claude-fable-5-2
review_state: llm_drafted_unreviewed
source_checked_on: 2026-11-21

mappings:
  # FM-1.1 Disobey task specification
  - saica_value: scope_creep
    external_id: FM-1.1
    confidence: partial
    note: >
      Acting beyond the stated task violates the task's constraints, which
      FM-1.1 covers; FM-1.1 is wider (any unmet requirement or constraint).
  - saica_value: logic_error
    external_id: FM-1.1
    confidence: partial
    note: >
      FM-1.1 includes code that runs but misses a stated requirement (the
      paper's ChatDev Wordle example ships a fixed word list against the
      spec), which is logic_error. FM-1.1 also covers non-code violations.

  # FM-1.2 Disobey role specification
  - saica_value: scope_creep
    external_id: FM-1.2
    confidence: related
    note: >
      Overstepping an assigned role ("an agent behaving like another") is
      the multi-agent analogue of acting outside a declared boundary. In
      SAICA the boundary is the user's request, not a role, so FM-1.1 is
      the closer entry. Was "partial" before the fix round of 2026-11-21.

  # FM-1.3 Step repetition
  - saica_value: cascading_failure
    external_id: FM-1.3
    confidence: related
    note: >
      Repeated steps show up in recovery spirals, but FM-1.3 is redoing
      completed work, while cascading_failure is fixes that add new errors.
  - saica_value: context_pollution
    external_id: FM-1.3
    confidence: related
    note: >
      Repeating already-completed steps is a detection signal that the agent
      has lost track of session state.

  # FM-1.4 Loss of conversation history
  - saica_value: context_pollution
    external_id: FM-1.4
    confidence: partial
    note: >
      Context truncation that drops recent history is the "relevant prior
      information is dropped" part of context_pollution. context_pollution
      is wider (also accumulation of irrelevant material and earlier
      hallucinations treated as ground truth).

  # FM-1.5 Unaware of termination conditions
  - saica_value: scope_creep
    external_id: FM-1.5
    confidence: related
    note: >
      Not recognising that the task is done leads to unnecessary
      continuation, one route to unrequested follow-on work.

  # FM-2.1 Conversation reset
  - saica_value: context_pollution
    external_id: FM-2.1
    confidence: related
    note: >
      An unwarranted restart loses context and progress, an abrupt form of
      in-session state loss.

  # FM-2.3 Task derailment
  - saica_value: scope_creep
    external_id: FM-2.3
    confidence: related
    note: >
      Deviation from the objective "resulting in irrelevant or unproductive
      actions" overlaps with unrequested actions.
  - saica_value: context_pollution
    external_id: FM-2.3
    confidence: related
    note: >
      Gradual derailment often follows context degradation, but FM-2.3 is
      about the objective, context_pollution about session state.

  # FM-3.1 Premature termination
  - saica_value: incomplete_execution
    external_id: FM-3.1
    confidence: partial
    note: >
      Ending a task before its objectives are met overlaps with
      incomplete_execution (stopping before all user-specified items are
      addressed). Not exact: the SAICA mode is defined by a false "done"
      claim, which MAST does not require, and FM-3.1 also covers early
      stops with no such claim. Was "exact" before the fix round of
      2026-11-21.

  # FM-3.2 No or incomplete verification
  - saica_value: incomplete_execution
    external_id: FM-3.2
    confidence: related
    note: >
      Claiming success without checking outcomes is how incomplete work
      ships as "done"; FM-3.2 is the missing check, not the missing work.
  - saica_value: logic_error
    external_id: FM-3.2
    confidence: related
    note: >
      Omitted verification is what lets a logic_error propagate undetected;
      the overlap is cause and effect, not the same failure.

  # FM-3.3 Incorrect verification
  - saica_value: test_manipulation
    external_id: FM-3.3
    confidence: partial
    note: >
      Weakening or rewriting tests yields a verification step that does not
      validate anything. FM-3.3 covers honest but inadequate checking too;
      test_manipulation is the deliberate gaming case.

unmapped:
  - category: FM-2.2
    reason: >
      Fail to ask for clarification: SAICA has no mode for not asking or
      not escalating.
  - category: FM-2.4
    reason: "Information withholding: between agents only."
  - category: FM-2.5
    reason: "Ignored other agent's input: between agents only."
  - category: FM-2.6
    reason: >
      Reasoning-action mismatch: no SAICA mode is defined by a gap between
      what the agent reasons and what it does.
