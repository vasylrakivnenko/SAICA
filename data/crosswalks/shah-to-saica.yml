# Rebuilt 2026-11-21 against version 2 of Shah et al. (arXiv 2603.06847v2,
# read as PDF; see data/taxonomies/shah-2026-agentic-faults.yml). The rows
# that were here before used ids of the v1 structure (SHAH-MAJ-*) and root
# cause labels that are in neither version.
#
# How to read this file. Shah et al. classify defects in the code of agent
# software (frameworks, libraries, tools, applications), found in issues
# and pull requests. SAICA modes classify what a coding agent does on a
# task. The two do not label the same thing, so no row is "exact". A row
# is given only where the paper's text for an entry names something that
# is in the definition or the detection signals of the SAICA mode:
#   partial = same observable defect, different actor or cause;
#   related = the Shah defect can produce, or looks like, the SAICA failure.
# Mapped levels: the 14 categories and the 12 root causes. Dimensions,
# fault types (the paper gives them a count but no definition) and
# symptoms are listed under `unmapped` with that reason.
#
# SAICA modes with no neighbour in this taxonomy: fabrication,
# dependency_blindness, security_vulnerability, scope_creep,
# supply_chain_attack, cascading_failure, test_manipulation. A text search
# of both versions of the paper finds no test manipulation, scope or
# supply-chain content. "Cascading failures" in the paper means errors
# spreading between components, not SAICA's fix attempts that add new
# errors.
#
# Earlier rows downgraded or removed, with the reason (E4):
#   context_pollution <-> "Context and State Persistence" (exact) -> now
#     SHAH-CAT-03, related: bugs in memory storage code, not degradation
#     of an agent's working context.
#   logic_error <-> "Input Interpretation and Logic" (exact) -> now
#     SHAH-CAT-04, partial: narrower, and about framework code.
#   obsolescence <-> "API Evolution and Schema Drift" (exact) -> that label
#     is not in the paper; nearest real entry is SHAH-RC-02, partial.
#   dependency_blindness <-> "Dependency Management" (related) -> removed:
#     dependency_blindness is re-implementing what a dependency already
#     offers; the Shah category is about installing and resolving them.
#   supply_chain_attack rows -> removed: the paper does not discuss attacks.
# Drafted by an LLM agent. No person has reviewed these rows yet.

id: shah-to-saica
saica_axis: failure_mode
taxonomy: shah-2026-agentic-faults
authored_by:
  - claude-opus-4-7
  - claude-fable-5-2
review_state: llm_drafted_unreviewed
source_checked_on: 2026-11-21

mappings:
  # --- Categories ---

  # SHAH-CAT-01 LLM Interaction
  - saica_value: context_pollution
    external_id: SHAH-CAT-01
    confidence: related
    note: >
      The category includes "errors in context-window handling" that show
      up as "context-window overflows" and "truncated prompts". A framework
      that truncates the prompt wrongly makes the agent lose context it
      still needs, which is one form of context_pollution. The rest of the
      category (model configuration, token accounting) has no SAICA mode.

  # SHAH-CAT-02 Agent Lifecycle and State
  - saica_value: incomplete_execution
    external_id: SHAH-CAT-02
    confidence: related
    note: >
      Scheduling and termination defects "may cause the agents to skip
      tasks". The visible result is unfinished work; the cause is a bug in
      the orchestration code, and no false "done" message is involved.
  - saica_value: context_pollution
    external_id: SHAH-CAT-02
    confidence: related
    note: >
      The same defects make agents "repeat actions unexpectedly" and "lose
      track of intermediate execution state", which are detection signals
      of context_pollution. Cause differs: orchestration code, not a
      degrading context.

  # SHAH-CAT-03 Memory Management
  - saica_value: context_pollution
    external_id: SHAH-CAT-03
    confidence: related
    note: >
      Bugs in serialization, timestamps and persistent storage "prevent
      agents from reliably preserving contextual information". That is a
      storage-code defect (8 faults); context_pollution is the working
      context of a session getting worse. Was "exact" before 2026-11-21.

  # SHAH-CAT-04 Input Interpretation
  - saica_value: logic_error
    external_id: SHAH-CAT-04
    confidence: partial
    note: >
      Code that runs on real APIs but parses, validates or converts its
      input wrongly is a logic_error when a coding agent writes it.
      Narrower than logic_error (input handling only) and observed in
      framework code. Was "exact" before 2026-11-21.

  # SHAH-CAT-10 Dependency & Environment Management
  - saica_value: obsolescence
    external_id: SHAH-CAT-10
    confidence: related
    note: >
      Part of the category is "broken functionality after dependency
      upgrades" and specifications that "become outdated following
      upstream library changes". Most of it is installation and resolver
      failures, which obsolescence does not cover.

  # SHAH-CAT-12 Failure Handling & Implementation Robustness
  - saica_value: incomplete_execution
    external_id: SHAH-CAT-12
    confidence: related
    note: >
      Suppressed exceptions and error handling that does not work "manifest
      as silent execution failures, incomplete task execution".
      incomplete_execution lists skipped error paths among its forms.
  - saica_value: logic_error
    external_id: SHAH-CAT-12
    confidence: related
    note: >
      The category holds the fault type "Implementation Logic Error" (20
      faults). The paper gives the name and the count only, so the link
      rests on the name.

  # --- Root causes ---

  # SHAH-RC-02 Dependency Drift
  - saica_value: obsolescence
    external_id: SHAH-RC-02
    confidence: partial
    note: >
      Dependencies "introduce breaking changes, deprecate interfaces, or
      alter platform support", so existing code calls an interface that
      has changed. Same observable as obsolescence. Different cause: here
      the library moved after the code was written; in obsolescence the
      agent writes the old form from stale training data.

  # SHAH-RC-03 State Management Complexity
  - saica_value: context_pollution
    external_id: SHAH-RC-03
    confidence: related
    note: >
      Shared execution state ("context windows, tool traces, memory
      structures") read and updated inconsistently by several components.
      A cause inside the framework of what context_pollution describes
      from the agent's side.

  # SHAH-RC-04 Model Interface Instability
  - saica_value: obsolescence
    external_id: SHAH-RC-04
    confidence: related
    note: >
      Assumptions about a model provider's API are "invalidated by API
      changes". The same drift as SHAH-RC-02, at the model-provider
      boundary.

  # SHAH-RC-07 External API Instability
  - saica_value: obsolescence
    external_id: SHAH-RC-07
    confidence: related
    note: >
      External APIs change endpoints, authentication or schemas and the
      integration code is not updated in time. The same drift as
      SHAH-RC-02, for external services.

unmapped:
  # Categories
  - category: SHAH-CAT-05
    reason: >
      Tool Invocation: wrong arguments or unsupported operations on a real
      tool. This sits between two SAICA modes: fabrication needs an API
      that does not exist, logic_error needs a call that is correct at the
      signature level.
  - category: SHAH-CAT-06
    reason: >
      External Access: the agent cannot connect or authenticate. An
      availability fault, not a weakness an attacker can use, so not
      security_vulnerability.
  - category: SHAH-CAT-07
    reason: >
      Resource Interaction: wrong paths and misconfigured storage. No SAICA
      mode is defined by this; single cases would fall into logic_error as
      the residual class.
  - category: SHAH-CAT-08
    reason: "System Coordination: race conditions between components. No SAICA mode."
  - category: SHAH-CAT-09
    reason: "Execution Monitoring: logging and tracing defects. No SAICA mode."
  - category: SHAH-CAT-11
    reason: >
      Platform & Integration Compatibility: operating system, CPU and
      filesystem assumptions. Not about deprecated or removed APIs, so not
      obsolescence.
  - category: SHAH-CAT-13
    reason: "User Interface Defects: dashboards of agent tools. No SAICA mode."
  - category: SHAH-CAT-14
    reason: "Documentation Issues: wrong documentation of the framework. No SAICA mode."
  # Root causes
  - category: SHAH-RC-01
    reason: >
      Data Schema Mismatches: the cause the paper gives for Input
      Interpretation faults, which are mapped through SHAH-CAT-04.
  - category: SHAH-RC-05
    reason: >
      Error Propagation Failures: errors crossing layers without handling.
      SAICA's cascading_failure means something else (an agent's fixes
      adding new errors), so the similar name is not a match.
  - category: SHAH-RC-06
    reason: "Configuration Ambiguity: configuration read differently by components. No SAICA mode."
  - category: SHAH-RC-08
    reason: "Architectural Coupling: a design property of the framework. No SAICA mode."
  - category: SHAH-RC-09
    reason: "Resource Limit Violations: memory, payload, context-length or rate limits exceeded. No SAICA mode."
  - category: SHAH-RC-10
    reason: >
      Credential Misconfiguration: missing or invalid credentials that make
      a call fail. Not a leaked secret or an exploitable weakness, so not
      security_vulnerability.
  - category: SHAH-RC-11
    reason: "Concurrency Issues: missing synchronisation. No SAICA mode."
  - category: SHAH-RC-12
    reason: "Documentation Drift: outdated documentation. No SAICA mode."
  # Fault types are not listed one by one: Figure 2 gives each a count and
  # no definition, and each is covered by its category above (mapped or
  # listed). Dimensions are groupings of categories.
  # Symptoms (Table 1)
  - category: SHAH-SYM-01
    reason: "Symptom 'Data and Validation Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-02
    reason: "Symptom 'Runtime Execution Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-03
    reason: "Symptom 'Unhandled Exceptions': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-04
    reason: "Symptom 'Build Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-05
    reason: "Symptom 'Dependency Installation Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-06
    reason: "Symptom 'Agent Behaviour Anomalies': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-07
    reason: "Symptom 'LLM Interaction Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-08
    reason: "Symptom 'Network Connectivity Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-09
    reason: "Symptom 'User Interface Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-10
    reason: "Symptom 'Tool Invocation Errors': how a fault shows up to a developer, not a failure class."
  - category: SHAH-SYM-11
