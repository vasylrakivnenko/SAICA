# Scope. The Swiss Cheese Model's categories are properties and parts of
# guardrails (quality attributes, pipeline targets, protected artifacts,
# guardrail actions), not failure classes. This crosswalk is therefore
# sparse: it covers only the five quality attributes whose text names a
# failure (hallucinations, endless loops, data leakage, attacks, harmful
# output). A row here links a guardrail property to the failure it is
# meant to prevent; that is a weaker kind of link than in the other files.
# Crosswalks from SC-PIPE, SC-ART and SC-ACT to the SAICA facets
# temporal_phase, locus_of_control and control_paradigm have not been
# written.
#
# State on 2026-11-21: the rows are those drafted on 2026-04-22 and have
# not been re-judged; the taxonomy labels were checked against the arXiv v4
# PDF that day; `unmapped` was added.
# Drafted by an LLM. No person has reviewed these rows yet.

id: swiss-to-saica
saica_axis: failure_mode
taxonomy: swiss-cheese-model
authored_by:
  - claude-opus-4-7
review_state: llm_drafted_unreviewed
source_checked_on: 2026-11-21

mappings:
  # SC-QA-01 — Accuracy (mitigates hallucinations, misinformation)
  - saica_value: fabrication
    external_id: SC-QA-01
    confidence: partial
    note: >
      "Hallucinations" in SC-QA-01 corresponds most directly to SAICA's
      fabrication (non-existent code references) at the agent-code interface.
  - saica_value: logic_error
    external_id: SC-QA-01
    confidence: related
    note: Factually wrong outputs that are not code-reference errors map to logic_error.

  # SC-QA-02 — Efficiency (prevents endless loops, resource-intensive tasks)
  - saica_value: context_pollution
    external_id: SC-QA-02
    confidence: related
    note: >
      Endless loops are a context_pollution detection signal (repeated
      identical tool calls); SC-QA-02 names the guardrail side.

  # SC-QA-03 — Privacy (prevents sensitive-data leakage)
  - saica_value: security_vulnerability
    external_id: SC-QA-03
    confidence: partial
    note: >
      Sensitive-data leakage is a security_vulnerability subclass; SC-QA-03
      names the guardrail property.

  # SC-QA-04 — Security (defends against adversarial attacks, data integrity)
  - saica_value: security_vulnerability
    external_id: SC-QA-04
    confidence: partial
    note: Direct guardrail-side counterpart of security_vulnerability.
  - saica_value: supply_chain_attack
    external_id: SC-QA-04
    confidence: related
    note: >
      Adversarial-attack coverage includes the supply-chain vector in
      practice, though SC-QA-04 does not name it specifically.

  # SC-QA-05 — Safety (prevents harmful / misleading outputs)
  - saica_value: fabrication
    external_id: SC-QA-05
    confidence: related
    note: Misleading outputs include fabricated references in the code domain.

unmapped:
  - category: SC-QA-06
    reason: "Fairness: a property of a guardrail; no SAICA mode covers bias."
  - category: SC-QA-07
    reason: "Compliance: a property of a guardrail (legal and regulatory standards), not a failure class."
  - category: SC-QA-08
    reason: "Generalizability: a property of a guardrail, not a failure class."
  - category: SC-QA-09
    reason: "Customizability: a property of a guardrail, not a failure class."
  - category: SC-QA-10
    reason: "Adaptability: a property of a guardrail, not a failure class."
  - category: SC-QA-11
    reason: "Traceability: a property of a guardrail, not a failure class."
  - category: SC-QA-12
    reason: "Portability: a property of a guardrail, not a failure class."
  - category: SC-QA-13
    reason: "Interoperability: a property of a guardrail, not a failure class."
  - category: SC-QA-14
    reason: "Interpretability: a property of a guardrail, not a failure class."
  - category: SC-PIPE
    reason: >
      Pipelines (Prompts, Intermediate Results, Final Results): where a
      guardrail is applied. That is a question of timing (SAICA's
      temporal_phase facet), not a failure class.
  - category: SC-ART
    reason: >
      Artifacts (ten kinds, from Goals to Foundation Models): what a
      guardrail protects (closest to SAICA's locus_of_control facet), not a
      failure class.
  - category: SC-ACT
    reason: >
      Actions (thirteen, from Block to Evaluate): what a guardrail does
      when triggered (closest to SAICA's control_paradigm facet), not a
      failure class.
