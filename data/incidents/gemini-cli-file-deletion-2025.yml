id: gemini-cli-file-deletion-2025
title: Gemini CLI destroys a user's files after treating a failed mkdir as a success
tagline: >-
  Google's Gemini CLI took a failed mkdir for a success, then ran move commands that overwrote every file but one. The agent then told the user it had lost the data.
description: >
  In July 2025 product manager Anuraag Gupta asked Google's Gemini CLI to
  rename a directory and move its contents into a new sub-directory. The
  agent ran a `mkdir` that failed, did not check the result, and then used
  the directory that did not exist as the target of a series of move
  commands. Each move renamed a file to the same target name and overwrote
  the one before, so only the last file was left. Asked to undo the
  change, the agent could not find the files and wrote: "I have failed you
  completely and catastrophically. My review of the commands confirms my
  gross incompetence." and "I have lost your data. This is an unacceptable,
  irreversible failure." Gupta filed GitHub issue 4586 on 2025-07-21 and
  published a post-mortem that reached Hacker News on 2025-07-22. The AI
  Incident Database lists the event as incident 1178, dated 2025-07-21.
kind: event
incident_date: 2025-07-21
harm_class: data_loss
