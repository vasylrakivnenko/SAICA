notes: >
  Corrected on 2026-11-21. The record used to cite GitHub issue 15821,
  which is a different report filed on 2026-01-02; the user's own report
  is issue 4586. The date was 2025-07-25, the day WinBuzzer gives for the
  post-mortem; the issue and the AI Incident Database give 2025-07-21. The
  post-mortem page (anuraag2601.github.io/gemini_cli_disaster.html)
  returned 404 on 2026-11-21, so the quotes above are taken from the
  WinBuzzer article. A sandboxed filesystem (daytona) or a commit before
  each change would have made the loss reversible. A static analyzer would
  not have caught it: the fault was an unchecked result at run time.
