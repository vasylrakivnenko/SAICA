documented_by: []

mitigated_by:
- daytona

notes: >
  Aider's git-commit-per-change + daytona's sandboxed filesystem would have
  made this either trivially reversible or not-on-the-host. Do NOT claim a
  static analyzer would have caught it — this was a runtime assumption
  failure, not a pre-execution fault.
