notes: >
  A vendor's research write-up, not an incident. Corrected on 2026-11-21
  from the article: the text does not say that the session it observed
  involved `starlette-reverse-proxy`; that name is given as an example, so
  the title and text no longer claim it. `harm_class` was
  "security_breach" although the record itself called the session
  harmless. The article shows no publication date on the page; 2025-05-01
  is the approximate date this record already carried and was not
  verified.
