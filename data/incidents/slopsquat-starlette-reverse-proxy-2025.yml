id: slopsquat-starlette-reverse-proxy-2025
title: 'Trend Micro research: coding agents invent package names such as "starlette-reverse-proxy"'
tagline: >-
  Trend Micro reports seeing an agent generate a plausible package name that did not exist; the build failed with "module not found". It gives `starlette-reverse-proxy` as an example of such a name.
description: >
  Trend Micro's write-up on slopsquatting says: "During our research, we
  observed an advanced agent confidently generating a perfectly plausible
  package name out of thin air, only to have the build crash with a
  'module not found' error moments later." It names
  `starlette-reverse-proxy` as an example of a dependency a coding agent
  can hallucinate, and points out that an attacker could register such a
  name on PyPI so that a later run installs the attacker's code. The
  article also compares how many made-up package names several agents and
  models propose per task. Nothing harmful happened in the observed
  session.

kind: study
incident_date: 2025-05-01
harm_class: user_reported
reproducibility: plausible

exhibited_failure_modes:
- fabrication
- supply_chain_attack

affected_systems:
- unnamed coding agent

source_urls:
- https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/slopsquatting-when-ai-agents-hallucinate-malicious-packages

documented_by:
