notes: >
  `mitigated_by` is conservative: plan-mode + HITL gating (claude-code) and
  git-commit-per-change with trivial revert (aider) would have prevented or
  neutralized the destructive action. Replit's own post-incident shipped
  controls mirror the same pattern. Do NOT claim any tool would have
  "caught" this — supervision is design, not omniscience.
