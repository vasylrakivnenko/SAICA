id: copilot-secret-leakage-cuhk-2024
title: GitHub Copilot induced to disclose real hard-coded secrets via redaction prompts
tagline: >-
  CUHK researchers showed Copilot can reconstruct real secrets from redacted public GitHub code; 6.4% of sampled Copilot-active repos leaked live credentials completable via masked prompts.
description: >
  Researchers at the Chinese University of Hong Kong demonstrated that
  GitHub Copilot could be induced to reproduce verbatim hard-coded
  credentials (API keys, tokens, passwords) present in its training data by
  prompting it to complete redacted portions of public source files. In a
  sample of ~20,000 repositories where Copilot was active, over 1,200
  (6.4%) leaked at least one secret via this technique — a 40% higher
  incidence than the base rate of public-repo secret leakage. The finding
  confirmed that LLM code-completion tools can act as a secondary
  exfiltration channel for credentials independent of any live-system
  compromise.

incident_date: 2024-05-01
harm_class: security_breach
reproducibility: confirmed

exhibited_failure_modes:
- security_vulnerability
- context_pollution

affected_systems:
- GitHub Copilot

source_urls:
