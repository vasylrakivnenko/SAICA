notes: >
  A study, not an incident; incident_date is the date of the first arXiv
  version (the id says 2024, the year of the FSE publication). Corrected on
  2026-11-21 from the paper and the GitGuardian post (published
  2025-03-27). Until then this record said that 6.4% of sampled
  repositories "leaked at least one secret via this technique": it
  attached GitGuardian's repository statistic to the study's method. It
  was dated 2024-05-01 as "month of public write-up", which matches
  neither source. A second source,
  prompt.security/blog/securing-enterprise-data-in-the-face-of-github-copilot-vulnerabilities,
  now redirects to the site's home page and was removed. The listed tools
  catch committed credentials before merge; they do not stop a model from
  emitting one.
