id: copilot-secret-leakage-cuhk-2024
title: "Study: GitHub Copilot and Amazon CodeWhisperer emit hard-coded credentials seen in training (Huang et al., FSE 2024)"
tagline: >-
  Researchers built 900 prompts from GitHub files with the credential removed. Copilot returned 2,702 well-formed credentials and CodeWhisperer 129; two were confirmed to be working keys.
description: >
  "Your Code Secret Belongs to Me: Neural Code Completion Tools Can Memorize
  Hard-Coded Credentials" (Huang, Li, Wu, Zhang and Lyu; four of the five
  authors at the Chinese University of Hong Kong; arXiv 2309.07639, FSE
  2024) tests whether code completion tools reproduce credentials from
  their training data. The authors took GitHub code files that contain a
  credential, removed it and asked the tool to complete the line: 900
  prompts for 18 kinds of secret. After filtering out ill-formed strings,
  2,702 of the 8,127 suggestions from GitHub Copilot and 129 from Amazon
  CodeWhisperer had the format of a real credential. Some were identical
  to the removed one, others came from elsewhere. Two were shown to be
  working keys (Stripe test secret keys).

  A separate figure is often quoted with this study and does not come from
  it: GitGuardian reports that in a sample of about 20,000 repositories
  where Copilot is active, more than 1,200 (6.4%) leaked at least one
  secret, a rate it puts 40% above that of all public repositories. That
  is an observation about repositories, not a result of the prompting
  method.
kind: study
incident_date: 2023-09-14
harm_class: user_reported
reproducibility: plausible

exhibited_failure_modes:
- security_vulnerability
- context_pollution

affected_systems:
- GitHub Copilot
- Amazon CodeWhisperer

source_urls:
- https://arxiv.org/abs/2309.07639
- https://blog.gitguardian.com/yes-github-copilot-can-leak-secrets/

