notes: >
  A vulnerability disclosure with proofs of concept, confirmed by the
  vendors; `harm_class` is "user_reported" because no compromise outside
  the tests is reported. Corrected on 2026-11-21 from the two sources.
  Until then this record merged three separate disclosures into one "July
  2025 study led by Aonan Guan and Orca Security", dated 2025-07-15, nine
  months before its main source. The other two are different work and are
  not described here: Pillar Security's "Rules File Backdoor" (hidden
  instructions in rules files used by Cursor and GitHub Copilot, published
  2025-03-18,
  https://www.pillar.security/blog/new-vulnerability-in-github-copilot-and-cursor-how-hackers-can-weaponize-code-agents)
  and Orca Security's "RoguePilot" (a GitHub issue that prompt-injects
  Copilot in Codespaces and leaks a GITHUB_TOKEN, published 2026-02-16,
  https://orca.security/resources/blog/roguepilot-github-copilot-vulnerability/).
  The id says 2025 because ids are not changed once published. The listed
  tools would not have fully prevented the attack; prompt-injection
  defences are partial.
