id: copilot-prompt-injection-github-comments-2025
title: "Comment and Control: Claude Code Security Review, Gemini CLI Action and GitHub Copilot Agent hijacked through GitHub comments"
tagline: >-
  Pull-request titles, issue bodies and comments can make three AI agents on GitHub Actions run commands and leak the repository's secrets. All three vendors confirmed the findings.
description: >
  On 2026-04-15 security researcher Aonan Guan, with Zhengyu Liu and Gavin
  Zhong of Johns Hopkins University, published "Comment and Control", a
  prompt injection method against AI agents that run in GitHub Actions.
  Text that an outside contributor controls (a pull-request title, an
  issue body, an issue comment, a hidden HTML comment) is read by the agent
  as instructions. The write-up shows the method against three agents:
  Anthropic's Claude Code Security Review (a crafted PR title makes the
  agent run commands and reveal credentials), Google's Gemini CLI Action
  (an API key obtained through issue comments) and GitHub Copilot Agent (a
  payload hidden in an HTML comment scans for secrets and gets past the
  network firewall; here the victim must first assign the issue to
  Copilot). SecurityWeek reports that the findings were sent to Anthropic,
  Google and GitHub, that all three confirmed them, and that bounties of
  $100, $1,337 and $500 were paid; GitHub classed the issue as a known
  architectural limitation. The sources report no use of the method
  outside the researchers' own tests.
kind: event
incident_date: 2026-04-15
harm_class: user_reported
reproducibility: confirmed

exhibited_failure_modes:
- security_vulnerability
- context_pollution

affected_systems:
- Claude Code Security Review (GitHub Action)
- Google Gemini CLI Action
- GitHub Copilot Agent

source_urls:
