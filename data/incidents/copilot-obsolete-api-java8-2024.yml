id: copilot-obsolete-api-java8-2024
title: "Study: code LLMs complete Python code with deprecated library APIs (Wang et al., ICSE 2025)"
tagline: >-
  Wang et al. gave seven code LLMs 28,125 completion prompts built on 145 deprecated APIs from eight Python libraries. Of the plausible completions, 25% to 38% used the deprecated API.
description: >
  "LLMs Meet Library Evolution: Evaluating Deprecated API Usage in LLM-based
  Code Completion" (Wang, Huang, Zhang, Feng, Zhang, Liu and Peng; arXiv
  2406.09834, accepted at ICSE 2025) measures how often a code LLM completes
  a line with an API that its library has deprecated. The study uses 145
  mappings from a deprecated API to its replacement in eight Python
  libraries (Numpy, Pandas, scikit-learn, SciPy, seaborn, TensorFlow,
  PyTorch, Transformers), 28,125 completion prompts and seven models
  (CodeGen-350m, CodeGen-2b, CodeGen-6b, DeepSeek-Coder-1.3b, StarCoder2-3b,
  CodeLlama-7b and GPT-3.5). Most completions used neither the deprecated
  API nor its replacement: only 9% to 23% were "plausible". Among the
  plausible ones, the deprecated usage rate was 25% to 38%, and larger
  models had higher rates. The authors give two causes: deprecated usages
  in the training data, and no knowledge of deprecations at inference time.
kind: study
incident_date: 2024-06-14
harm_class: user_reported
reproducibility: plausible

exhibited_failure_modes:
- obsolescence

affected_systems:
- CodeGen (350M, 2B, 6B)
- DeepSeek-Coder 1.3B
- StarCoder2 3B
- CodeLlama 7B
- GPT-3.5

