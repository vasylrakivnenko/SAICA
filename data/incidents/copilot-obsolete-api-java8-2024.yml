notes: >
  A study, not an incident; incident_date is the date of the first arXiv
  version. Corrected on 2026-11-21 from the paper (v3 PDF). Until then this
  record cited arXiv 2406.08291, which is an unrelated paper in
  mathematical biology, and described a study of GitHub Copilot and Amazon
  CodeWhisperer on Java collections ("~30% of completions") that the paper
  does not contain: it tests neither product and no Java. The id still
  says "copilot" and "java8" because ids are not changed once published.
  `mitigated_by` used to list semgrep, which the KG does not tag for
  obsolescence, and the note named a tool that is not a KG node; the list
  is empty until a link is checked. `reproducibility` is "plausible"
  because no independent replication is recorded here.
