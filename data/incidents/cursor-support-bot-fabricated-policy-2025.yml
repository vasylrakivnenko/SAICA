notes: >
  Not strictly a coding-agent incident, but the supplier is a coding-agent
  vendor and the failure mode (confident fabrication of policy) is the same
  class the SAICA-KG `fabrication` node describes. Useful datapoint for the
  "supervision applies to the whole product surface, not just the editor"
  argument.
