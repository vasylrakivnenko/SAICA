id: spracklen-2024-hallucinated-package-prevalence
title: "Study: 19.7% of the package names recommended by 16 code LLMs do not exist (Spracklen et al., USENIX Security 2025)"
tagline: >-
  16 LLMs, 576,000 code samples: 440,445 of 2.23 million recommended packages (19.7%) do not exist. Re-running a prompt ten times, 43% of hallucinated names came back every time.
description: >
  "We Have a Package for You! A Comprehensive Analysis of Package
  Hallucinations by Code Generating LLMs" (Spracklen, Wijewickrama, Sakib,
  Maiti, Viswanath and Jadliwala; arXiv 2406.10279, USENIX Security 2025)
  measures how often code LLMs recommend packages that do not exist. With
  16 models and two prompt datasets the authors generated 576,000 code
  samples in Python and JavaScript. The samples named 2.23 million
  packages, of which 440,445 (19.7%) were not in PyPI or npm; 205,474 of
  those names were unique. The rate is a share of recommended package
  names, not of code samples. It was 5.2% on average for the commercial
  models and 21.7% for the open-source models. To test persistence, 500
  prompts that had produced a hallucination were each run ten more times:
  43% of the hallucinated packages came back in all ten runs and 39% in
  none. The paper calls the failure "package hallucination" and the attack
  it enables a package confusion attack; it does not use the later term
  slopsquatting.
kind: study
incident_date: 2024-06-12
harm_class: user_reported
reproducibility: plausible

exhibited_failure_modes:
- fabrication
- supply_chain_attack

affected_systems:
- GPT-4
- GPT-3.5
- CodeLlama
- DeepSeekCoder
- Mistral
- 11 others evaluated in the paper

