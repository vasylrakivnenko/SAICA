notes: >
  A study, not an incident; incident_date is the date of the first arXiv
  version. Corrected on 2026-11-21 from the paper (v3). Until then the
  record said that 19.7% of code samples reference a package that does not
  exist; the paper's 19.7% is the share of recommended package names. It
  named the venue as USENIX Security 2024 with the date 2024-08-14 and
  linked to a usenix.org page that returns 404; the paper is in USENIX
  Security 2025. `harm_class` was "security_breach", which the schema
  defines as a confirmed incident with compromise; a measurement is not
  one. `reproducibility` is "plausible" because no independent replication
  is recorded here.
