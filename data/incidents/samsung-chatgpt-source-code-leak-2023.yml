notes: >
  Included as a boundary case: the interaction pattern (pasting code into
  an LLM prompt) is identical to coding-agent workflows, and
  `context-hub` is the right class of tool (enterprise-side context
  gating) to prevent it. Excluding it would omit the most cited public
  corporate-policy AI-coding harm of the pre-Devin era.
