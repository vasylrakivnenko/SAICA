id: samsung-chatgpt-source-code-leak-2023
title: Samsung engineers leak proprietary source code and meeting minutes into ChatGPT
tagline: >-
  In three separate March 2023 sessions, Samsung DS engineers pasted proprietary semiconductor source code and internal meeting recordings into ChatGPT to debug or summarize.
description: >
  In March 2023 Samsung Semiconductor (DS division) approved employee use
  of ChatGPT. Within 20 days three separate incidents were discovered:
  (1) an engineer pasted source code from a semiconductor equipment
  measurement-database program into ChatGPT to ask for a fix; (2)
  another pasted code for a program identifying defective equipment to
  request optimization; (3) a third uploaded a full internal meeting
  recording and asked ChatGPT to produce minutes. Per OpenAI's terms at
  the time, the pasted content was stored on OpenAI servers and
  effectively unrecoverable. Samsung imposed a company-wide ban on
  generative-AI use on 2023-05-02. The incident is the canonical public
  demonstration of context-leakage via AI coding assistants; although the
  "agent" here is ChatGPT proper rather than a dedicated coding agent,
  the interaction pattern is identical to pasting code into Copilot Chat
  / Cursor Chat / Claude Code prompts.
incident_date: 2023-03-30
harm_class: data_loss
