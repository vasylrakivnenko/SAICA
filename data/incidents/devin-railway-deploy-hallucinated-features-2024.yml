notes: >
  An evaluation of 20 tasks by one team, so `kind` is "study"; the Railway
  episode is one task inside it. incident_date is the date of Answer.AI's
  post (the id says 2024 because ids are not changed once published).
  `mitigated_by` is empty: no KG tool is linked. A step-by-step review of
  the plan would have shown the Railway limit earlier, but that is a way
  of working, not a tool in the KG.
