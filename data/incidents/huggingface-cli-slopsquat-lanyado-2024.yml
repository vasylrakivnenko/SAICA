id: huggingface-cli-slopsquat-lanyado-2024
title: 'LLM-hallucinated "huggingface-cli" package downloaded thousands of times after a researcher registered it'
tagline: >-
  Bar Lanyado (Lasso Security) saw AI models recommend a `huggingface-cli` package that did not exist, registered it empty on PyPI and counted 15,000 to 30,000 downloads in about three months.
description: >
  Bar Lanyado of Lasso Security noticed that generative AI models
  repeatedly recommended `pip install huggingface-cli`, a package that did
  not exist; the real tool is installed with
  `pip install -U "huggingface_hub[cli]"`. He registered the name on PyPI
  as an empty, harmless package to see whether a hallucinated name could
  be used to distribute code. The Register (2024-03-28) reports more than
  15,000 authentic downloads in three months; Simon Willison's summary of
  Lanyado's post (2024-04-01) gives 30,000. By February 2024 the
  installation instructions of Alibaba's GraphTranslator project told
  users to install the fake package. In the same research Lanyado asked
  four models (GPT-3.5-Turbo, GPT-4, Gemini Pro, Cohere Command) thousands
  of "how to" questions and measured how often they invented package
  names. The practice was later named slopsquatting.

kind: event
incident_date: 2024-03-28
harm_class: user_reported
reproducibility: confirmed

exhibited_failure_modes:
- fabrication
- supply_chain_attack

affected_systems:
- GPT-3.5
- GPT-4
- Gemini Pro
- Alibaba GraphTranslator README

source_urls:
- https://www.theregister.com/2024/03/28/ai_bots_hallucinate_software_packages/
- https://simonwillison.net/2024/Apr/1/diving-deeper-into-ai-package-hallucinations/

documented_by:
- spracklen-2024-we-have-a-package

mitigated_by:
- socket
- snyk

notes: >
  The package was empty on purpose, so no code was delivered;
  `harm_class` is "user_reported" (it was "security_breach", which the
  schema defines as a confirmed incident with compromise). incident_date
  is the date of The Register's article. Corrected on 2026-11-21 from the
  two sources: the real install target is `huggingface_hub[cli]`, not
  `huggingface[cli]`; the two sources disagree on the download count
  (15,000 or 30,000) and on the month of registration (December 2023 or
  January 2024), and both figures are now given. Spracklen et al. cite
  Lanyado's earlier posts on package hallucination.
