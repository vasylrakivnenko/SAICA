notes: >
  An experiment on a testbed, not an incident: no deployed system was
  attacked. Corrected on 2026-11-21 from the whitepaper PDF. Until then
  this record called the case "hypothetical" and gave no numbers; the
  whitepaper reports a test with measured success rates. `harm_class` was
  "security_breach", which the schema defines as a confirmed incident with
  compromise. The case is the source example for the category MS-ES-01 in
  the microsoft-airt-2025 taxonomy.
