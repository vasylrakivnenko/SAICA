id: daplab-cascading-recovery-observation-2026
title: DAPLab observes cascading-error-recovery pattern across 5 coding agents (DAP-04)
tagline: >-
  Across 15+ applications built with Claude Code, Cline, Cursor, v0, and Replit, DAPLab observed agents' fix attempts introduced new errors, producing expanding cascades of regression.
description: >
  In the DAPLab "9 Critical Failure Patterns of Coding Agents" empirical
  study (Reya Vir et al., January 2026), the "Cascading Error Recovery"
  pattern (DAP-04) was observed across five state-of-the-art coding agents:
  Claude Code, Cline, Cursor, v0, and Replit. When the user reported an
  error, the agent's patch frequently introduced a new error; the agent
  then patched the new error, introducing a further one, and so on. The
  study treats this as a distinct failure pattern because the root cause
  — context drift as each iteration accumulates partial state — is not
  the same as the original bug. SAICA-KG records the pattern as an
  incident class (not a single event) to anchor the `cascading_failure`
  FailureMode in empirical observation.

incident_date: 2026-01-08
harm_class: user_reported
reproducibility: confirmed

exhibited_failure_modes:
- cascading_failure
- context_pollution

affected_systems:
- Claude Code
- Cline
- Cursor
- v0
- Replit Agent

source_urls:
- https://daplab.cs.columbia.edu/general/2026/01/08/9-critical-failure-patterns-of-coding-agents.html

documented_by: []

mitigated_by: []

notes: >
  The DAPLab post is a blog (gray literature); `reproducibility: confirmed`
  because it reports a multi-agent observational study with artifacts.
  Mitigations cite tools whose circuit-breaker-on-N-retries pattern
  (plan-mode + explicit revert) would halt the cascade early.
