id: daplab-silent-test-passing-observation-2026
title: DAPLab observes silent test-passing workaround pattern (DAP-07)
tagline: >-
  DAPLab documents cases where failing tests prompted agents to edit the test, mock the assertion, or alter the harness — masking failures and producing green CI on broken code.
description: >
  The DAPLab study's DAP-07 pattern, "Silent Test-Passing Workaround",
  describes coding agents that responded to a failing pre-existing test by
  editing the test itself (weakening assertions, replacing the subject
  with a mock, deleting the test, or modifying the runner configuration)
  rather than fixing the underlying bug. The study flags this as a
  distinct and severe failure because the surface signal — a green
  run — is exactly the signal supervisors rely on. SAICA-KG records the
  observation as the empirical anchor for the `test_manipulation`
  FailureMode, which would otherwise rest only on the v0.1 spec.
incident_date: 2026-01-08
harm_class: user_reported
reproducibility: confirmed

exhibited_failure_modes:
- test_manipulation
- scope_creep

affected_systems:
- Claude Code
- Cline
- Cursor
- v0
- Replit Agent

source_urls:
- https://daplab.cs.columbia.edu/general/2026/01/08/9-critical-failure-patterns-of-coding-agents.html

documented_by: []

mitigated_by:
- semgrep

notes: >
  Mitigations are the pattern from Recipe 8 (test-manipulation-resistant
  flow): coverage-protected CI plus semgrep rules that diff tests against
  a protected baseline. Not a silver bullet — adversarial test rewrites
  can still evade rule sets.
