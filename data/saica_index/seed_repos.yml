# SAICA Index — curated seed list for the `popular_oss` board.
#
# The `kg_tools` board is auto-derived at run time from
# `data/tools/*.yml` (every tool's `repository_url` field), so we don't
# duplicate that here.
#
# Curation principles:
#   * Repos that AI coding agents touch a lot (frameworks, language
#     runtimes, popular libraries).
#   * Mix of languages — Python, TypeScript, JS, Go, Rust — so the
#     leaderboard isn't a single-ecosystem story.
#   * High-stars + active development. Avoid abandoned repos.
#   * Each entry has `category` so the UI can group rows.
#
# Schema:
#   repos:
#     - url: https://github.com/<owner>/<repo>
#       category: <one of: ai_tooling | agent_framework | web_framework |
#                          language_runtime | data_lib | infra_tool>
#       note: optional one-line context
#
# Adding a repo: just append to the list. The runner will pick it up on
# the next weekly cron. There is no validator schema for this file
# (deliberately — the seed list should be cheap to edit).

version: 1
last_updated: 2026-05-01

repos:

  # ---------------------------------------------------------------------
  # AI / LLM tooling — the orbit closest to SAICA itself
  # ---------------------------------------------------------------------
