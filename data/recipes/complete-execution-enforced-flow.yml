id: complete-execution-enforced-flow
name: Complete-execution-enforced flow
tagline: >
  claude-code plan-mode (checklist) → aider (commit-per-item) → pytest
  that fails on surviving TODOs. DAP-01 fails the build, not silently
  ships.
description: >
  Composition for the `incomplete_execution` FailureMode, anchored in
  the DAPLab DAP-01 observation.

  Stage 1: claude-code plan-mode decomposes the task into a numbered
  checklist. Each item must be marked done explicitly.

  Stage 2: aider commits one change per checklist item, so the
  diff-to-plan correspondence is one-to-one.

  Stage 3: a pytest-level completion gate greps the diff for
  unresolved `TODO`, `FIXME`, or `...` (Python ellipsis placeholder)
  markers and fails the build if any remain. Agents that mark the
  checklist done while leaving the codebase incomplete trip this gate.

targets_failure_modes:
  - incomplete_execution

stack:
  - claude-code
  - aider

evidence_tier: anecdotal
language: polyglot

notes: >
  The pytest completion gate is a project-level pattern (marker grep
  test) and not a KG-node tool. Evidence tier `anecdotal`; no public
  benchmark yet exists for incomplete-execution rates under checklist
  discipline.
