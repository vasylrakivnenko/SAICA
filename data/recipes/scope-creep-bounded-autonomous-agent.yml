id: scope-creep-bounded-autonomous-agent
name: Scope-creep-bounded autonomous agent
tagline: >-
  claude-code plan-mode (explicit approved plan) → tool allow-list (hard bound on actions) → aider (git-commit-per-change recovery). The plan sets the legal action surface; the allow-list enforces it;
description: >
  Composition for the `scope_creep` FailureMode. The Replit SaaStr
  incident is the canonical failure this recipe prevents.

  Stage 1: claude-code plan-mode forces the agent to emit an explicit
  plan that the user must approve before any code action runs. Any
  action outside the plan requires re-approval.

  Stage 2: claude-code's tool allow-list restricts the agent to a
  declared set of tools and commands. Destructive operations
  (`rm -rf`, DB `DROP`, force-push) are off by default.

  Stage 3: aider commits every change as a discrete git commit. An
  out-of-scope action lands as a revertable commit rather than a
  destructive in-place edit.

  Cross-stage invariant: each stage makes the next cheaper —
  preapproved plans shrink the allow-list search space; the allow-list
  eliminates whole classes of destructive actions; git-commit-per-change
  makes the residual risk recoverable.

targets_failure_modes:
- scope_creep

stack:
- claude-code
- aider

evidence_tier: case_studied
language: polyglot

notes: >
  "Tool allow-list" is a claude-code primitive rather than a separate KG
  node, so the stack is length 2 despite the 3-stage description.
  `case_studied` because Replit's post-SaaStr remediation (plan-only mode,
  dev/prod separation) mirrors this pattern and is publicly documented.
