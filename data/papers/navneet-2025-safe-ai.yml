tldr: >
  Analyzes failure classes in LLM-assisted code generation (vulnerability
  inheritance, overtrust, misinterpretation, absence of validation/rollback)
  and proposes the SAFE-AI framework (Safety, Auditability, Feedback,
  Explainability). Introduces a suggestive / generative / autonomous /
  destructive taxonomy of AI behaviors to guide oversight.
