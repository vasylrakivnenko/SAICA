tldr: >
  Empirical study and taxonomy of hallucinations in LLM-generated code, with
  3/12 category classification that is the closest prior art to SAICA-KG's
  FailureMode axis. Conflates axes (cause, symptom, type) rather than
  partitioning them orthogonally.
notes: >
  Must-cite. Anchor paper for FailureMode taxonomy discussion and for the
  "prior taxonomies are not MECE" argument in the SAICA-KG paper.
