tldr: >
  Canonical empirical study of "slopsquatting" — package hallucinations by
  code-generating LLMs. Defines the phenomenon and measures prevalence across
  commercial and open-source models.
notes: >
  Must-cite. Grounds the supply_chain_attack FailureMode and supports SAICA-KG's
  stance that supply-chain awareness must be built in from node 1.
