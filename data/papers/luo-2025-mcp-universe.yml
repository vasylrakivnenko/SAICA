tldr: >
  First comprehensive benchmark of LLM agents against real-world MCP servers
  across 6 domains and 11 MCP servers. Uses execution-based evaluators
  (format, static, dynamic). Even GPT-5 reaches only 43.72%; exposes the
  long-context and unknown-tools challenges inherent to MCP.
