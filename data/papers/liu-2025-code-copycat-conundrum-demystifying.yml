year: 2025
title: "Code Copycat Conundrum: Demystifying Repetition in LLM-based Code Generation"
venue: arXiv
arxiv_id: "2504.12608"
doi: "10.48550/arXiv.2504.12608"
url: https://www.semanticscholar.org/paper/9abb51ba135ccec7902d06777efc2f60ecfe262f
