notes: >
  Must-cite. Prototype evidence that recovery ControlParadigm can be made
  cheap (~1.8s per transaction) for fully-autonomous agents. Directly
  supports SAICA-KG Tool nodes in the recovery x environment x
  fully_autonomous cell of the partition cube. Pairs with AgentForge
  (Kumar 2026) for the sandbox tool cluster.
