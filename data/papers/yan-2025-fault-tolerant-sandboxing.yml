tldr: >
  Fault-tolerant sandboxing framework wrapping agent actions in atomic
  transactions over a policy-based interception layer plus a transactional
  filesystem snapshot mechanism. Demonstrates 100% interception of high-risk
  commands and 100% rollback of failed states at 14.5% overhead, contrasted
  against Gemini-CLI's headless-incompatible auth model.
