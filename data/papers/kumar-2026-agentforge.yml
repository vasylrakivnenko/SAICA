tldr: >
  Introduces execution-grounded verification as a first-class principle:
  every code change must survive sandboxed execution before propagation.
  AGENTFORGE instantiates this with Planner/Coder/Tester/Debugger/Critic
  agents sharing memory and a mandatory Docker sandbox, achieving 40.0% on
  SWE-Bench Lite — 26-28 points above single-agent baselines.
