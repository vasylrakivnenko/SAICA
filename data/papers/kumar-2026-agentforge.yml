notes: >
  Must-cite. Canonical example of "sandbox as first-class verification"
  multi-agent architecture. Grounds SAICA-KG's correction ControlParadigm
  tools and the environment LocusOfControl; pairs with Yan 2025 (fault-
  tolerant sandboxing) for the sandbox Tool cluster.
