tldr: >
  Systematic literature review of LLMs for code generation, organizing the
  field around data curation, advances, evaluation, ethics, environment, and
  real-world applications. Introduces a taxonomy of Code LLM developments
  and compares HumanEval/MBPP/BigCodeBench results across models.
