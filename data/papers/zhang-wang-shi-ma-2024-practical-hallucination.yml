tldr: >
  Empirical study of hallucinations in repository-level code generation across
  six mainstream LLMs. Derives a hallucination taxonomy, distributes
  phenomena by model, identifies four contributing factors, and proposes an
  RAG-based mitigation that is effective across the studied models.
