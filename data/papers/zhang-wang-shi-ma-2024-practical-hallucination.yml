notes: >
  Must-cite. Repository-level framing is closer to SAICA-KG's agent-context
  scope than function-level hallucination work. Cite as evidence that
  context_pollution and fabrication both intensify at repo scale and for the
  RAG mitigation that maps onto context-locus Tools.
