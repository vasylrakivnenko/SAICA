notes: >
  Domain-specific failure taxonomy (embedded ML) that exposes
  compiles-but-breaks-downstream patterns relevant to SAICA-KG's logic_error
  and obsolescence modes. Narrower than the general-agent taxonomies but
  useful for triangulating silent-failure signals.
