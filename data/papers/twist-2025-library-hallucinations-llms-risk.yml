year: 2025
title: "Library Hallucinations in LLMs: Risk Analysis Grounded in Developer Queries"
venue: arXiv
arxiv_id: "2509.22202"
doi: "10.48550/arXiv.2509.22202"
url: https://www.semanticscholar.org/paper/25e6119d93a3f600b1753141a0c2b21a513958fd
