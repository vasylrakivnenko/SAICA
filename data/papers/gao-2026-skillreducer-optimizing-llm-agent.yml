notes: >
  Large-scale empirical study of 55,315 publicly available agent skills
  (pre-packaged instruction sets) finding systemic inefficiencies: 26.4% lack
  routing descriptions, over 60% of body content is non-actionable, and
  reference files inject tens of thousands of tokens per invocation. Proposes
  SkillReducer, a two-stage compression framework evaluated on 600 skills and
  the SkillsBench benchmark, achieving 48% description and 39% body
  compression while improving functional quality by 2.8%. The 'less-is-more'
  finding directly evidences context_pollution as a supervision-relevant
  failure mode. Relates to SAICA-KG failure modes: context_pollution,
  scope_creep. Useful for arguing that context curation is a first-class
  supervision activity, not just a cost optimization.
