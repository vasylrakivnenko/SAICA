tldr: >
  Automated fuzz-driver generation driven by an interprocedural code
  knowledge graph of the target repository and an LLM agent. Achieves 8.73%
  mean coverage improvement over SOTA, reduces crash-triage workload by
  84.4%, and finds 11 real bugs (9 previously unreported).
