notes: >
  Must-cite. Concrete precedent for "code knowledge graph" as a supervision
  substrate — directly relevant to SAICA-KG's positioning as a KG over
  supervision tools and to Tool nodes in the environment locus that use
  CKG-style interprocedural context.
