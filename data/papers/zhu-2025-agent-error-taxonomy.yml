title: "Where LLM Agents Fail: A Taxonomy of Errors and the AgentErrorBench Dataset"
venue: arXiv
arxiv_id: "2509.25370"
url: https://arxiv.org/abs/2509.25370
citation_count: 22
relevance_tags:
