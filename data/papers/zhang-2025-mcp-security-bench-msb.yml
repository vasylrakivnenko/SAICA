abstract: >
  The Model Context Protocol (MCP) standardizes how large language model
  (LLM) agents discover, describe, and call external tools. While MCP
  unlocks broad interoperability, it also enlarges the attack surface by
  making tools first-class, composable objects with natural-language
  metadata, and standardized I/O. We present MSB (MCP Security Benchmark),
  the first end-to-end evaluation suite that systematically measures how
  well LLM agents resist MCP-specific attacks throughout the full tool-use
  pipeline: task planning, tool invocation, and response handling. MSB
  contributes: (1) a taxonomy of 12 attacks including name-collision,
  preference manipulation, prompt injections embedded in tool descriptions,
  out-of-scope parameter requests, user-impersonating responses, false-error
  escalation, tool-transfer, retrieval injection, and mixed attacks; (2) an
  evaluation harness that executes attacks by running real tools (both
  benign and malicious) via MCP rather than simulation; and (3) a robustness
  metric that quantifies the trade-off between security and performance: Net
  Resilient Performance (NRP). We evaluate nine popular LLM agents across 10
  domains and 405 tools, producing 2,000 attack instances. Results reveal
  the effectiveness of attacks against each stage of MCP. Models with
  stronger performance are more vulnerable to attacks due to their
  outstanding tool calling and instruction following capabilities. MSB
  provides a practical baseline for researchers and practitioners to study,
  compare, and harden MCP agents. Code: https://github.com/dongsenzhang/MSB
tldr: >
