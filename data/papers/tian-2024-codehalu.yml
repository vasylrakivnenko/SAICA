tldr: >
  Introduces the concept of code hallucinations and a four-class execution-
  verification taxonomy (mapping, naming, resource, logic). Provides the
  CodeHalu detection algorithm and the CodeHaluEval benchmark (8,883 samples
  over 699 tasks) across 17 LLMs.
relevance_tags:
  - failure-mode-taxonomy
  - hallucination
  - code-generation
  - benchmark
  - execution-based-verification
notes: >
  Must-cite. The "mapping / naming / resource / logic" axis is a direct
  predecessor to SAICA-KG's FailureMode partition (fabrication / logic_error
  / dependency_blindness). Cite as prior art for the fabrication FailureMode
  and for execution-based detection Tools.
