notes: >
  Introduces MCPGAUGE, the first comprehensive evaluation framework for
  LLM-MCP interactions along four dimensions: proactivity (self-initiated tool
  use), compliance (adherence to tool-use instructions), effectiveness (task
  performance post-integration), and overhead (computational cost). 160-
  prompt suite across 25 datasets covering knowledge comprehension, general
  reasoning, and code generation; evaluated on six commercial LLMs and 30 MCP
  tool suites with ~20,000 API calls. Findings challenge the prevailing
  assumption that MCP integration unambiguously helps. Relates to SAICA-KG
  failure modes: scope_creep, context_pollution, incomplete_execution. Cite as
  evidence that 'tool use' itself is a supervisable behavior, not just a
  capability.
