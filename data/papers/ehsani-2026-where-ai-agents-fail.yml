tldr: >
  Large-scale study of 33k agent-authored PRs across five coding agents on
  GitHub. Quantifies merge outcomes by task type, code-change size, CI, and
  review dynamics; derives a hierarchical taxonomy of rejection patterns
  from qualitative analysis of 600 PRs (duplicate PRs, unwanted features,
  lack of reviewer engagement, agent misalignment).
relevance_tags:
  - failure-mode-taxonomy
  - coding-agent
  - github
  - empirical
  - agent-misalignment
notes: >
  Must-cite. Single best empirical study of *deployed* coding-agent failure
  signatures. Grounds SAICA-KG's scope_creep and context_pollution
  FailureModes with real PR-rejection data and validates the KG's
  multi-agent-PR framing.
