notes: >
  Primary source for the shah-2026-agentic-faults Taxonomy node. The
  abstract above is the arXiv v2 text (2026-05-07). Version 1 (2026-03-06)
  reported a different structure: five dimensions, 13 major categories, 37
  fault categories, 13 symptom classes and 12 root causes; v2 reorganised
  it into four dimensions, 14 categories, 34 fault types, 12 symptoms and
  12 root causes. Both versions were read as PDF on 2026-11-21. The paper
  studies defects reported in closed issues and merged pull requests of 40
  agentic-AI repositories (234 of the 385 sampled faults come from
  frameworks, 75 from libraries, 39 from tools, 37 from applications). It
  does not study what a coding agent does on a user's task, so its
  categories are evidence about faults in agent software and only
  indirect evidence about SAICA failure modes.
