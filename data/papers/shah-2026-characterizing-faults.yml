year: 2026
title: "Characterizing Faults in Agentic AI: A Taxonomy of Types, Symptoms, and Root Causes"
venue: arXiv
arxiv_id: "2603.06847"
arxiv_version: "v2"
url: https://arxiv.org/abs/2603.06847
semantic_scholar_id: "a82a683a61862e69ac7f3b14924d631a6fbd5165"
citation_count: 1
abstract: >
  Agentic AI systems combine LLM-based reasoning, orchestration, tool
  invocation, and interaction with external environments. These systems
  introduce faults that are difficult to characterize using existing
  taxonomies. To address this gap, we present an empirical study of faults
  in agentic AI systems. We collected 13,602 issues and pull requests from
  40 repositories and, using stratified sampling, selected 385 faults for
  analysis. Through grounded theory, we derived taxonomies of fault types,
  symptoms, and root causes. We then used Apriori-based association rule
  mining to identify relationships among faults, symptoms, and root causes,
  and validated the taxonomy through a developer study with 145
  practitioners. Our analysis produced a taxonomy of 34 fault types,
  organized into four architectural dimensions. These faults manifested as
  failures in structured-output interpretation, tool calls, runtime
  execution, and exception handling, with root causes including data schema
  mismatches, dependency drift, state management complexity, and model
  interface instability. Furthermore, association rules showed recurring
  cross-component propagation, linking structured data, dependency, and
  state management faults to their symptoms and root causes. Practitioners
  considered the taxonomy representative of agentic AI failures and
  suggested refinements related to multi-agent coordination and
  observability. These findings provide an empirical basis for diagnosing
  faults and improving reliability in agentic AI systems.
tldr: >
  Study of 385 faults sampled from 13,602 issues and pull requests in 40
  agentic-AI repositories. arXiv v2 (2026-05-07): 34 fault types in 14
  categories and four dimensions, 12 symptom categories and 12 root-cause
  categories, checked in a survey of 145 practitioners.
