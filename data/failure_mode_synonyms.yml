# Per-failure-mode synonym dictionary — Stage 0b of the v2 ingestion pipeline.
#
# Why this file exists:
#   Discovery quality is bottlenecked by query-string coverage. Search
#   "scope creep" and you miss "task drift," "instruction overflow,"
#   "role violation." The `aliases` field on each FM YAML is the
#   community-canonical short list; this file is the *richer* set used
#   by discovery queries to expand the search surface, paired with
#   *negative* keywords that look related but aren't.
#
# Schema per FM:
#   <fm_id>:
#     canonical:        the human-facing name (mirror of name in data/failure_modes/)
#     synonyms:         3-8 query terms used by discovery to expand the search
#     anchor_papers:    1-3 ids from data/papers/ that established or
#                       popularised the term (used to seed S2 citation-graph
#                       traversal)
#     negative_keywords: 5-10 terms that match by surface form but mean
#                        something else — used to filter out false positives
#                        before any expensive stage runs
#
# Editorial notes:
#   * Synonyms are an inclusive OR, not a strict semantic match — we want
#     recall here; precision is enforced downstream by the classifier
#     (Stage 6) and the substring-verified extractions (Stage 7a).
#   * Negative keywords are a strict NOT — any candidate matching one of
#     these in the abstract drops at Stage 1 unless a positive synonym
#     also appears.
#   * `anchor_papers` reuses ids from data/papers/*.yml. If the paper id
#     here doesn't resolve, the validator won't error (this file is
#     advisory) but the discovery pipeline will skip the seed.
#
# How it's used downstream:
#   * Stage 1 (discovery) — every query is built as
#       (FM canonical OR synonym1 OR ... OR synonymN) AND NOT (negative keywords)
#   * Stage 5 (substantive-use) — anchor_papers seed S2 citation-graph
#     traversal for substantive-use scoring.
#
# Versioning: bump `version` on any non-trivial change. Discovery runs
# log the version they consumed for reproducibility.

version: 1
last_updated: 2026-05-01


scope_creep:
  canonical: Scope creep
  synonyms:
    - task drift
    - over-action
    - over-execution
    - unrequested changes
    - role violation
    - instruction overflow
    - mission creep
    - boundary violation
  anchor_papers:
    - cemri-2025-mast
    - zhu-2025-agent-error-taxonomy
  negative_keywords:
    - feature creep   # software-eng concept about product, not agent behaviour
    - scope statement  # PM/PMI usage
    - in-scope
    - mvp scope
    - scope of work


