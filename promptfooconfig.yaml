# promptfoo runner for the two live probes of the Ask endpoint.
#
# What this is: a manual, paid check. Each test asks the running Ask
# backend one question (a real model call) and checks the answer against
# the KG. Run it only with ASK_API set:
#
#     ASK_API=http://127.0.0.1:4322/api/ask npx promptfoo@<pinned version> eval --no-cache
#
# What this is not: a CI gate, and not a test of anything when ASK_API is
# unset. In that case both tests FAIL with the reason "NOT RUN" (promptfoo
# has no "skipped" result), so an unrun probe can never show as passed.
# The same two probes run under pytest, where "not run" is a real skip:
# tests/test_ask_live_probe.py.
#
# The file-consistency checks that used to live here (ids in
# recommendations.json resolve, failure modes are known, nothing is listed
# below the measured floor) test no model. They are plain pytest now:
# tests/test_recommendations_file.py.
#
# The provider is promptfoo's `echo`: the HTTP call to the Ask endpoint is
# made inside the Python assertion (evals/_assertions.py), which is where
# the model is asked.

description: Live probes of the SAICA Ask endpoint (manual, paid, needs ASK_API)

prompts:
  - "{{question}}"

providers:
  - id: echo

tests:
  - file://evals/ask_probe.yaml
