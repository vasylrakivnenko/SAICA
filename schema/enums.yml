# SAICA-KG controlled vocabularies (v0.1)
# Enum values are citation-stable. IDs here must not change across minor versions.
#
# This file is the human-readable copy: labels and descriptions live here.
# The values themselves are defined in pipeline/models.py, and
# tests/test_schema_enums_yml.py fails when the two lists differ. No code
# reads this file.

ControlParadigm:
  description: >
    Strict partition over where in the failure lifecycle a supervision
    intervention acts. Every Tool belongs to exactly one ControlParadigm.
  partition: true
  values:
    prevention:
      label: Prevention
      description: Act before the failure has a chance to occur.
    detection:
      label: Detection
      description: Observe that a failure has occurred or is occurring.
    correction:
      label: Correction
      description: Fix the failure after detecting it.
    recovery:
      label: Recovery
      description: Restore system state when in-place correction is not viable.

TemporalPhase:
  description: >
    Strict partition over the temporal position of a supervision intervention
    relative to the agent's action. Every Tool belongs to exactly one phase.
  partition: true
  values:
    pre_generation:
      label: Pre-generation
      description: Before the agent emits the current action.
      external_alignment:
        - "Manheim-Homewood 2025: ex-ante"
        - "Liu 2025: Phase 1 (planning)"
        - "Lindner 2025: sync"
    in_generation:
      label: In-generation
      description: During emission (constrained decoding, tool-call validation).
      external_alignment:
        - "Manheim-Homewood 2025: real-time"
        - "Lindner 2025: semi-sync"
    post_generation:
      label: Post-generation
      description: After emission, before or after execution.
      external_alignment:
        - "Manheim-Homewood 2025: ex-post"
        - "Liu 2025: Phase 3 (validation)"
        - "Lindner 2025: async"

Implementation:
  description: >
    Strict partition over how a Tool's supervising check is carried out.
    Classified by the mechanism that makes the supervision decision, not by
    whether the product is used alongside LLMs. Every Tool has exactly one.
  partition: true
  values:
    deterministic:
      label: Deterministic
      description: A program (rules, parsers, type checks, tests, sandboxes, proxies, grammars); same input, same output; no model calls.
    llm_based:
      label: LLM-based
      description: A model makes the supervising decision (LLM-as-judge, AI reviewer, model-generated attacks).
    hybrid:
      label: Hybrid
      description: A deterministic core plus model-based checks shipped in the product (optional LLM judges, ML classifiers next to rules).
    prompt_artifact:
      label: Prompt artifact
      description: Not a program; skills, rules or docs that the coding agent itself reads.

AutonomyLevel:
  description: >
    Strict partition over the operational autonomy at which a supervision tool
    is designed to work. Every Tool has exactly one AutonomyLevel; tools that
    span multiple modes should be modeled as separate Tool nodes or via
    `operating_modes` secondary tags.
  partition: true
  values:
    fully_autonomous:
      label: Fully autonomous
      description: Agent acts without per-step human approval.
      external_alignment:
        - "Navneet-Chandra 2025: autonomous / destructive"
        - "Cihon-Stein 2025: high impact + low oversight"
    graduated_hitl:
      label: Graduated HITL
      description: Autonomous for low-risk actions; escalates for high-risk.
      external_alignment:
        - "Navneet-Chandra 2025: generative"
        - "Cihon-Stein 2025: medium impact + partial oversight"
    full_hitl:
      label: Full HITL
      description: Every write/mutation requires human approval.
      external_alignment:
        - "Navneet-Chandra 2025: suggestive"
        - "Cihon-Stein 2025: low impact + high oversight"

FailureMode:
  description: >
    Open set of supervision-addressable failure classes. Multi-valued by
    design; a single Tool may address several FailureModes, and a single
    real-world fault may exhibit multiple modes. Failure modes are
    overlapping tags, not a partition: two reviewers may tag the same
    fault with different modes, and both can be right.
  partition: false
  values:
    fabrication:
      label: Fabrication
      description: Generating reference to non-existent APIs, packages, or symbols.
    obsolescence:
      label: Obsolescence
      description: Using deprecated APIs, retired packages, or outdated library versions.
    dependency_blindness:
      label: Dependency blindness
      description: >
        Reimplementing functionality already available in declared dependencies,
        the standard library, or reachable internal modules. Cross-codebase
        reinvention. Distinct from intra-generation repetition (Liu 2025).
      aliases:
        - reinvention
    logic_error:
      label: Logic error
      description: Correct API use, incorrect logic.
    security_vulnerability:
      label: Security vulnerability
      description: Insecure patterns, injection flaws, weak cryptography, secret leakage.
    scope_creep:
      label: Scope creep
      description: Actions outside declared task boundary.
    context_pollution:
      label: Context pollution
      description: Trajectory drift, hallucination spirals, overlong or off-task context.
    supply_chain_attack:
      label: Supply-chain attack
      description: Slopsquatting, typosquatting, compromised MCP servers.
    cascading_failure:
      label: Cascading failure
      description: >
        Recovery attempts that compound the original error — each fix introduces
        new errors and the diff diverges from the working state.
      aliases:
        - recovery-spiral
        - compound-error
        - fix-regression
    incomplete_execution:
      label: Incomplete execution
      description: >
        Agent stops short of finishing the requested task — partial diffs,
        unfinished migrations, leftover TODOs.
    test_manipulation:
      label: Test manipulation
      description: >
        Agent gaming the test harness — disabling failing tests, adding overly
        permissive assertions, or mocking real interfaces away.
      aliases:
        - test-gaming
        - reward-hacking
        - spec-gaming

LocusOfControl:
  description: >
    Overlapping, multi-valued classification of where in the agent stack a
    supervision tool operates. Partition is not meaningful here.
  partition: false
  values:
    model:
      description: Training, fine-tuning, RLHF, safety layers inside the model.
    prompt:
      description: Prompt engineering, CoT, Re2, instruction design.
    context:
      description: RAG, retrieval, skill libraries, CLAUDE.md-style context.
    environment:
      description: Sandboxes, MCP, static analyzers, test harnesses.
    human:
      description: Approval gates, code review, HITL escalation.

IntegrationSurface:
  description: >
    How a Tool is deployed / consumed. Multi-valued and orthogonal to
    ControlParadigm / TemporalPhase / AutonomyLevel — those describe what
    the tool does; this describes how a caller wires it in. Crucial for
    "can I integrate this into a headless pipeline?" queries: ide_plugin /
    desktop_app / web_app require a human in an interactive UI, whereas
    cli / library / http_service / mcp_server / ci_app / proxy_gateway
    are pipeline-integratable.
  partition: false
  values:
    ide_plugin:
      description: Editor extension (VS Code, JetBrains, Neovim). Requires a human in the IDE.
    desktop_app:
      description: Standalone desktop GUI; forked or purpose-built code editor.
    web_app:
      description: Hosted browser-based workspace / cloud IDE / generative-UI product.
    cli:
      description: Invocable from the terminal / CI shell step.
    library:
      description: Python or TypeScript package imported programmatically.
    http_service:
      description: Self-hosted or managed HTTP API / observability backend.
    mcp_server:
      description: Model-Context-Protocol endpoint consumable by any MCP client.
    ci_app:
      description: GitHub / GitLab action, pre-commit hook, or PR-review bot.
    proxy_gateway:
      description: LLM gateway / proxy that sits between caller and model provider.

MaturityStatus:
  description: Lifecycle state of a Tool node. Informs staleness checks.
  partition: true
  values:
    experimental:
      description: Early, rapidly evolving, API may break.
    stable:
      description: Production-grade, API roughly stable.
    at_risk:
      description: Auto-flagged due to long inactivity or deprecation signal.
    deprecated:
      description: Maintainer-deprecated; successor should be named.
    abandoned:
      description: No maintainer activity, no successor named.

HarmClass:
  description: Incident harm classification for Incident nodes.
  partition: true
  values:
    user_reported:
      description: Surfaced by a user; no measurable downstream harm.
    data_loss:
      description: Data destruction, overwrite, or exfiltration.
    security_breach:
      description: Confirmed security incident with compromise.
    financial_loss:
      description: Measurable monetary impact.
    reputational:
      description: Public fallout or brand harm only.

IncidentReproducibility:
  description: How well-documented and reproducible an Incident is.
  partition: true
  values:
    confirmed:
      description: Reproduced by an independent party.
    plausible:
      description: Single-source but credible with artifacts.
    anecdotal:
      description: Single-source, no artifacts.

EvidenceTier:
  description: Evidence tier for Recipe nodes.
  partition: true
  values:
    anecdotal:
      description: One-off successful composition reported by users.
    case_studied:
      description: Documented case study or write-up.
    benchmark_validated:
      description: Benchmark evidence against a defined failure mode.

CrosswalkConfidence:
  description: How closely a SAICA value matches a category of an external taxonomy.
  partition: true
  values:
    exact:
      description: Same scope; either term can replace the other.
    partial:
      description: The scopes overlap; neither contains the other.
    broader:
      description: The SAICA value is broader than the external category.
    narrower:
      description: The SAICA value is narrower than the external category.
    related:
      description: Not the same thing, but a reader of one should know the other.

SaicaAxis:
  description: The SAICA facet a crosswalk maps an external taxonomy onto.
  partition: true
  values:
    failure_mode:
      description: The failure-mode tags.
    control_paradigm:
      description: Prevention, detection, correction, recovery.
    temporal_phase:
      description: Before, during or after the agent's action.
    autonomy_level:
      description: How much human approval the setting assumes.
    locus_of_control:
      description: Where the intervention acts (model, prompt, context, environment, human).

IncidentKind:
  description: >
    What an Incident node is. Only `event` is an incident in the plain
    sense of the word; the other kinds are kept because they are cited as
    evidence, and must be labelled as what they are.
  partition: true
  values:
    event:
      description: One dated real-world occurrence with a named system.
    study:
      description: A measurement reported by a paper or a vendor.
    hypothetical:
      description: A scenario that its own source calls hypothetical.
    pattern:
      description: A summary of a recurring behaviour with no single dated occurrence.

PaperProvenance:
  description: How a Paper record was produced (who or what wrote its fields).
  partition: true
  values:
    hand-curated:
      description: Typed by a person or an agent.
    s2-derived:
      description: >
        Written by a script from a Semantic Scholar search dump. Year,
        venue and tldr are that service's; authors are its author
        entities unless arxiv_version says the byline came from arXiv.
    elicit-derived:
      description: Written by a script from an Elicit search dump.
    arxiv-api:
      description: The whole record was written from the arXiv API.
    crossref-api:
      description: The whole record was written from the Crossref API.

ReviewState:
  description: Whether a person has read a file against its source.
  partition: true
  values:
    llm_drafted_unreviewed:
      description: Drafted by an LLM or an agent; no person has read it against the source.
    human_reviewed:
      description: Every row was read against the source by the people named in reviewed_by.
