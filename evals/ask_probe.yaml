# Two live probes of the Ask endpoint. Each one makes a real model call
# through ASK_API (see promptfooconfig.yaml). Without ASK_API both fail
# with "NOT RUN"; they never report a pass for a probe that did not run.

- description: Ask names a tool the catalog tags for scope_creep and cites only KG ids
  vars:
    question: "live: scope_creep tool"
  metadata:
    tags: [live, paid, ask_probe]
  assert:
    - type: python
      value: file://evals/_assertions.py:assert_ask_recommends_supervisor

- description: Ask tells fabrication from obsolescence and cites only KG ids
  vars:
    question: "live: fabrication vs obsolescence"
  metadata:
    tags: [live, paid, ask_probe]
  assert:
    - type: python
      value: file://evals/_assertions.py:assert_ask_distinguishes_failure_modes
